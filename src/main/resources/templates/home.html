<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Guitar MES</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header('ダッシュボード')}"></div>

<table border="1">
    <tr>
        <th>総ギター数</th>
        <th>仕掛中</th>
        <th>完成</th>
        <th>実施中工程</th>
        <th>完成率</th>
    </tr>

    <tr>
        <td th:text="${totalGuitarCount}"></td>
        <td th:text="${inProgressGuitarCount}"></td>
        <td th:text="${completedGuitarCount}"></td>
        <td th:text="${runningProcessCount}"></td>
        <td th:text="${completionRate + '%'}"></td>
    </tr>
</table>

<br>
<h2>部品在庫状況</h2>
<table>
	<tr>
		<th>使用可能ネック</th>
		<th>使用可能ボディ</th>
	</tr>
	
	<tr>
		<td th:text="${availableNeckCount}"></td>
		<td th:text="${availableBodyCount}"></td>
	</tr>
</table>
<h2>工程別平均作業時間</h2>

<table class="dashboard-table">
    <tr>
        <th>工程</th>
        <th>平均時間</th>
    </tr>

    <tr th:each="avg : ${averageProcessTimes}">
        <td th:text="${avg.processName}"></td>
        <td th:text="${avg.averageMinutes + '分'}"></td>
    </tr>
</table>
<br>

<h2>工程別状況</h2>
<table border="1">
	<tr>
		<th>工程</th>
		<th>本数</th>
	</tr>
	
	<tr th:each="processCount : ${processCounts}">
		<td th:text="${processCount.processName}"></td>
		<td th:text="${processCount.count}"></td>
	</tr>
</table>
<br>

<section class="component-dashboard">

    <h2>
        ボディ工程状況
    </h2>

    <div class="status-card-container">

        <div th:each="status : ${bodyStatusCounts}"
             class="status-count-card"
             th:classappend="${status.cssClass}">

            <div class="status-count-name"
                 th:text="${status.displayName}">
            </div>

            <div class="status-count-value"
                 th:text="${status.count}">
            </div>

            <div class="status-count-unit">
                本
            </div>

        </div>

    </div>

    <p>
        <a th:href="@{/bodies/view}">
            ボディ一覧を確認
        </a>
    </p>

</section>

<section class="component-dashboard">

    <h2>
        ネック工程状況
    </h2>

    <div class="status-card-container">

        <div th:each="status : ${neckStatusCounts}"
             class="status-count-card"
             th:classappend="${status.cssClass}">

            <div class="status-count-name"
                 th:text="${status.displayName}">
            </div>

            <div class="status-count-value"
                 th:text="${status.count}">
            </div>

            <div class="status-count-unit">
                本
            </div>

        </div>

    </div>

    <p>
        <a th:href="@{/necks/view}">
            ネック一覧を確認
        </a>
    </p>

</section>

<h2>現在のギター一覧</h2>
<table border="1">
	<tr>
		<th>ID</th>
		<th>シリアル番号</th>
		<th>製品名</th>
		<th>現在工程</th>
		<th>進捗率</th>
		<th>状態</th>
		<th>詳細</th>
	</tr>
	
	<tr th:each="guitar : ${guitars}"
	    th:class="${guitar.currentProcess ==
	               T(com.example.guitarmes.common.ProcessConstants).COMPLETED}
	               ? 'completed' : ''">
		<td th:text="${guitar.id}"></td>
		<td th:text="${guitar.serialNo}"></td>
		<td th:text="${guitar.productName}"></td>
		<td th:text="${guitar.currentProcess}"></td>
		<td th:text="${guitar.progressRate + '%'}"></td>
		<td>
			<span th:if="${guitar.hasRunningProcess}">
				実施中
			</span>
			
			<span th:if="${!guitar.hasRunningProcess}">
				待機中
			</span>
		</td>
		<td>
			<a th:href="@{/guitars/{id}/view(id=${guitar.id})}">
				詳細
			</a>
		</td>
	</tr>
</table>

<hr>
<div th:replace="~{fragments/menu :: menu}">
</div>

</body>
</html>
