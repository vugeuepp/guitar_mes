<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>ネック管理一覧</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header('ネック管理一覧')}"></div>
<main class="page-container">
<div class="page-toolbar"><p class="page-toolbar-description">ネック個体の工程を複数選択して一括処理できます。</p><div class="page-toolbar-actions"><a class="btn btn-primary" th:href="@{/necks/new}">新規ネック登録</a><a class="btn btn-process-end" th:href="@{/neck-processes/bulk/end/view}">一括工程終了</a></div></div>
<div th:if="${successMessage}" class="success-message" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="error-message" role="alert" th:text="${errorMessage}"></div>
<form id="bulk-start-form" th:action="@{/neck-processes/bulk/start}" method="post" class="bulk-process-form">
<section class="bulk-action-panel component-bulk-action-panel"><div class="form-group bulk-process-field"><label class="form-label" for="processId">対象工程</label><select id="processId" name="processId" class="form-select" required><option value="">選択してください</option><option th:each="process : ${neckProcesses}" th:value="${process.id}" th:text="${process.processName}" th:attr="data-process-name=${process.processName}"></option></select></div><div class="form-group bulk-worker-field"><label class="form-label" for="workerName">作業者</label><input id="workerName" name="workerName" class="form-input" placeholder="作業者名を入力" required></div><div class="bulk-selection-action"><div class="bulk-selection-summary"><span class="bulk-selection-heading">選択中</span><span class="bulk-selection-count"><strong id="selected-count">0</strong>件</span></div><button type="submit" class="btn btn-primary">一括工程開始</button></div><p class="form-help bulk-process-guidance">対象工程を選択すると、一致する個体だけを選択できます。</p></section>
<div th:if="${#lists.isEmpty(necks)}" class="empty-state">登録されているネックはありません。</div>
<div th:if="${not #lists.isEmpty(necks)}" class="table-container"><table class="data-table neck-management-table bulk-select-table"><colgroup><col class="management-column-checkbox"><col class="component-column-serial"><col class="component-column-model"><col class="component-column-process"><col class="component-column-status"><col class="component-column-operation"><col class="component-column-history"></colgroup><thead><tr><th><input type="checkbox" id="select-all" aria-label="全件選択"></th><th>シリアル番号</th><th>モデル名</th><th>現在工程</th><th>状態</th><th>工程操作</th><th>履歴</th></tr></thead><tbody><tr th:each="item : ${necks}" th:attr="data-process-name=${item.currentProcess}"><td class="bulk-checkbox-cell"><input type="checkbox" class="row-checkbox" name="neckIds" th:value="${item.id}" th:disabled="${item.status != 'WAITING' and item.status != 'WAITING_INSPECTION' and item.status != 'REWORK'}" th:attr="aria-label=${item.serialNo + 'を選択'},data-base-eligible=${!(item.status != 'WAITING' and item.status != 'WAITING_INSPECTION' and item.status != 'REWORK')}"></td><td><span class="component-serial-number" th:text="${item.serialNo}"></span></td><td class="component-model-cell"><div class="component-model-name" th:text="${item.modelName}" th:title="${item.modelName}"></div></td><td class="component-process-cell"><span class="process-badge" th:text="${item.currentProcess}" th:title="${item.currentProcess}"></span></td><td class="status-cell"><span class="status-badge" th:classappend="${@statusDisplay.getCssClass(item.status)}" th:text="${@statusDisplay.getLabel(item.status)}"></span></td><td class="component-operation-cell"><a th:if="${item.status == 'WORKING'}" class="btn btn-process-end" th:href="@{/neck-processes/end/view(neckId=${item.id})}">工程終了</a><a th:if="${item.status == 'WAITING' or item.status == 'WAITING_INSPECTION' or item.status == 'REWORK'}" class="btn btn-primary" th:href="@{/neck-processes/start/view(neckId=${item.id})}">工程開始</a><span th:if="${item.status == 'AVAILABLE' or item.status == 'ASSEMBLED' or item.status == 'REJECTED' or item.status == 'RETURNED'}">操作不可</span></td><td class="component-history-cell"><a class="btn btn-detail" th:href="@{/necks/{id}/process-history(id=${item.id})}">工程履歴</a></td></tr></tbody></table></div></form></main>
<script th:inline="none">
(() => {
    const processSelect = document.getElementById('processId');
    const workerName = document.getElementById('workerName');
    const submitButton = document.querySelector(
        '#bulk-start-form button[type="submit"], #bulk-start-form button:not([type])');
    const selectAll = document.getElementById('select-all');
    const boxes = Array.from(document.querySelectorAll('.row-checkbox'));
    const selectedCount = document.getElementById('selected-count');

    if (!processSelect || !workerName || !submitButton
            || !selectAll || !selectedCount) {
        return;
    }

    const processOptions = Array.from(processSelect.options)
        .filter(option => option.value !== '');

    const hasEligibleTarget = processName => boxes.some(box => {
        const row = box.closest('tr');
        const baseEligible = box.dataset.baseEligible === 'true';
        return baseEligible && row.dataset.processName === processName;
    });

    processOptions.forEach(option => {
        const processName = option.dataset.processName
            || option.textContent.trim();
        option.hidden = !hasEligibleTarget(processName);
        option.disabled = option.hidden;
    });

    const availableOptions = processOptions.filter(option => !option.hidden);
    const placeholder = processSelect.options[0];

    if (availableOptions.length === 0) {
        placeholder.textContent = '一括開始可能な工程はありません';
        processSelect.disabled = true;
        workerName.disabled = true;
        submitButton.disabled = true;
    } else {
        placeholder.textContent = '選択してください';
        processSelect.disabled = false;
        workerName.disabled = false;
        submitButton.disabled = false;
    }

    const updateSelectionState = () => {
        const enabledBoxes = boxes.filter(box => !box.disabled);
        const checkedBoxes = enabledBoxes.filter(box => box.checked);

        selectedCount.textContent = checkedBoxes.length;
        selectAll.disabled = enabledBoxes.length === 0;
        selectAll.checked = enabledBoxes.length > 0
            && checkedBoxes.length === enabledBoxes.length;
        selectAll.indeterminate = checkedBoxes.length > 0
            && checkedBoxes.length < enabledBoxes.length;
    };

    const applyProcessFilter = () => {
        const selectedOption = processSelect.selectedOptions[0];
        const processName = selectedOption?.dataset.processName
            || selectedOption?.textContent.trim()
            || '';
        const processSelected = processSelect.value !== '';

        boxes.forEach(box => {
            const row = box.closest('tr');
            const baseEligible = box.dataset.baseEligible === 'true';
            const matchesProcess = processSelected
                && row.dataset.processName === processName;

            box.checked = false;
            box.disabled = !(baseEligible && matchesProcess);
            row.classList.toggle(
                'is-disabled',
                !(baseEligible && matchesProcess));
        });

        selectAll.checked = false;
        selectAll.indeterminate = false;
        updateSelectionState();
    };

    processSelect.addEventListener('change', applyProcessFilter);
    selectAll.addEventListener('change', () => {
        boxes.filter(box => !box.disabled)
            .forEach(box => box.checked = selectAll.checked);
        updateSelectionState();
    });
    boxes.forEach(box => {
        box.addEventListener('change', updateSelectionState);
    });

    applyProcessFilter();
})();
</script></body></html>
