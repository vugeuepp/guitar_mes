<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ボディマスタ編集</title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header('ボディマスタ編集')}">
</div>
<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ボディマスタの表示名を編集します。
        </p>
        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/body-masters/{id}/view(id=${bodyMasterId})}">
                詳細へ戻る
            </a>
        </div>
    </div>
    <form th:action="@{/body-masters/{id}/edit(id=${bodyMasterId})}"
          th:object="${request}"
          method="post"
          class="form-container">
        <div th:if="${errorMessage}"
             class="error-message"
             role="alert"
             aria-live="polite">
            <div class="error-message-title">
                入力内容を確認してください
            </div>
            <p class="error-message-text"
               th:text="${errorMessage}">
            </p>
        </div>
        <section class="form-section">
            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Body Master
                    </p>
                    <h2 class="form-section-title">
                        ボディマスタ基本情報
                    </h2>
                </div>
                <p class="form-section-description">
                    識別情報と物理仕様は変更できません。
                    モデル名のみ編集できます。
                </p>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="modelCode"
                           class="form-label">
                        モデルコード
                    </label>
                    <input type="text"
                           id="modelCode"
                           th:field="*{modelCode}"
                           class="form-input"
                           readonly>
                </div>
                <div class="form-group">
                    <label for="productFamilyCode"
                           class="form-label">
                        製品ファミリーコード
                    </label>
                    <input type="text"
                           id="productFamilyCode"
                           th:field="*{productFamilyCode}"
                           class="form-input"
                           readonly>
                </div>
                <div class="form-group">
                    <label for="modelName"
                           class="form-label">
                        モデル名
                        <span class="form-required">
                            必須
                        </span>
                    </label>
                    <input type="text"
                           id="modelName"
                           th:field="*{modelName}"
                           class="form-input"
                           autocomplete="off"
                           required>
                    <p class="form-help">
                        一覧・詳細画面に表示する名称です。
                    </p>
                </div>
                <div class="form-group">
                    <label for="bodyType"
                           class="form-label">
                        ボディタイプ
                    </label>
                    <input type="text"
                           id="bodyType"
                           th:field="*{bodyType}"
                           class="form-input"
                           readonly>
                </div>
                <div class="form-group">
                    <label for="material"
                           class="form-label">
                        材質
                    </label>
                    <input type="text"
                           id="material"
                           th:field="*{material}"
                           class="form-input"
                           readonly>
                </div>
                <div class="form-group">
                    <label for="color"
                           class="form-label">
                        カラー
                    </label>
                    <input type="text"
                           id="color"
                           th:field="*{color}"
                           class="form-input"
                           readonly>
                </div>
            </div>
        </section>
        <div class="form-actions">
            <a class="btn btn-outline"
               th:href="@{/body-masters/{id}/view(id=${bodyMasterId})}">
                キャンセル
            </a>
            <button type="submit"
                    class="btn btn-primary">
                変更内容を保存
            </button>
        </div>
    </form>
</main>
</body>
</html>
