<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        生産計画登録
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
    <style>
        .date-entry { position: relative; width: 100%; }
        .date-entry .date-text { box-sizing: border-box; width: 100%; padding-right: 3rem; }
        .date-calendar-button {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            width: 3rem;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            border-left: 1px solid #d5d7da;
            background: transparent;
            color: #111827;
            cursor: pointer;
        }
        .date-calendar-button:hover { background: #f3f4f6; }
        .date-calendar-button:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: -2px;
        }
        .date-calendar-button svg { width: 1rem; height: 1rem; }
        .date-picker-anchor {
            position: absolute;
            top: 0;
            right: 0;
            width: 3rem;
            height: 100%;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div th:replace=
     "~{fragments/header :: header('生産計画登録')}">
</div>

<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">
            対象製品と計画内容を指定して、
            新しい生産計画を登録します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/production-orders/view}">
                生産計画一覧へ戻る
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}"
         class="empty-state">
        <p>
            登録可能な製品マスタがありません。
        </p>

        <a class="btn btn-primary"
           th:href="@{/products/new}">
            製品マスタを登録する
        </a>
    </div>

    <form th:if="${not #lists.isEmpty(products)}"
          th:action="@{/production-orders/create}"
          method="post"
          id="productionOrderForm"
          class="form-container">

        <section class="form-section">
            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Product
                    </p>
                    <h2 class="form-section-title">
                        対象製品
                    </h2>
                </div>

                <p class="form-section-description">
                    シリーズから順番に製品仕様を選択してください。
                </p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="seriesSelect"
                           class="form-label">
                        シリーズ
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="seriesSelect"
                            class="form-select"
                            required>
                        <option value="">
                            選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modelSelect"
                           class="form-label">
                        モデル
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="modelSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にシリーズを選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colorSelect"
                           class="form-label">
                        カラー
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="colorSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にモデルを選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fingerboardSelect"
                           class="form-label">
                        指板材
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="fingerboardSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にカラーを選択してください
                        </option>
                    </select>
                </div>
            </div>

            <input type="hidden"
                   id="productId"
                   name="productId">

            <div id="selectedProductInfo"
                 class="selected-product-info"
                 hidden>
                <div class="selected-product-label">
                    選択製品
                </div>

                <strong id="selectedProductText"
                        class="selected-product-value">
                </strong>
            </div>

            <p id="productErrorMessage"
               class="error-message"
               hidden>
            </p>
        </section>

        <section class="form-section">
            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Production Plan
                    </p>
                    <h2 class="form-section-title">
                        計画内容
                    </h2>
                </div>

                <p class="form-section-description">
                    計画数量と製造予定期間を入力してください。
                </p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="planMonth"
                           class="form-label">
                        対象月
                        <span class="form-required">
                            必須
                        </span>
                    </label>
                    <input type="month"
                           id="planMonth"
                           name="planMonth"
                           class="form-input"
                           th:value="${request.planMonth}"
                           required>
                </div>
                <div class="form-group">
                    <label for="plannedQuantity"
                           class="form-label">
                        計画数
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <div class="form-input-with-unit">
                        <input type="number"
                               id="plannedQuantity"
                               name="plannedQuantity"
                               class="form-input"
                               min="1"
                               required>

                        <span class="form-input-unit">
                            台
                        </span>
                    </div>

                    <p class="form-help">
                        1台以上の計画数量を入力してください。
                    </p>
                </div>

                <div class="form-group">
                    <label for="plannedStartDate"
                           class="form-label">
                        開始予定日
                    </label>

                    <div class="date-entry">
                        <input type="text" id="plannedStartDate" name="plannedStartDate"
                               class="form-input date-text" inputmode="numeric"
                               maxlength="10"
                               autocomplete="off"
                               placeholder="yyyy/MM/dd"
                               th:value="${#temporals.format(request.plannedStartDate, 'yyyy/MM/dd')}" required>
                        <button type="button"
                                id="plannedStartDateButton"
                                class="date-calendar-button"
                                aria-label="開始予定日をカレンダーから選択">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                                <path d="M16 3v4M8 3v4M3 10h18"></path>
                            </svg>
                        </button>
                        <input type="date" id="plannedStartDatePicker"
                               class="date-picker-anchor"
                               th:min="${minimumPlanDate}" th:max="${maximumPlanDate}"
                               tabindex="-1" aria-hidden="true">
                    </div>
                    <p class="form-help">yyyy/MM/dd、yyyy-MM-dd、yyyyMMddで入力できます。</p>
                </div>

                <div class="form-group">
                    <label for="dueDate"
                           class="form-label">
                        納期
                    </label>

                    <div class="date-entry">
                        <input type="text" id="dueDate" name="dueDate"
                               class="form-input date-text" inputmode="numeric"
                               maxlength="10"
                               autocomplete="off"
                               placeholder="yyyy/MM/dd"
                               th:value="${#temporals.format(request.dueDate, 'yyyy/MM/dd')}" required>
                        <button type="button"
                                id="dueDateButton"
                                class="date-calendar-button"
                                aria-label="納期をカレンダーから選択">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                                <path d="M16 3v4M8 3v4M3 10h18"></path>
                            </svg>
                        </button>
                        <input type="date" id="dueDatePicker"
                               class="date-picker-anchor"
                               th:min="${request.plannedStartDate}" th:max="${maximumPlanDate}"
                               tabindex="-1" aria-hidden="true">
                    </div>

                    <p class="form-help">
                        開始予定日以降の日付を指定してください。
                    </p>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <a class="btn btn-outline"
               th:href="@{/production-orders/view}">
                キャンセル
            </a>

            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary"
                    disabled>
                生産計画を登録
            </button>
        </div>
    </form>
</main>

<script th:inline="javascript">
    const products =
        /*[[${products}]]*/ [];

    const seriesSelect =
        document.getElementById(
            "seriesSelect"
        );

    const modelSelect =
        document.getElementById(
            "modelSelect"
        );

    const colorSelect =
        document.getElementById(
            "colorSelect"
        );

    const fingerboardSelect =
        document.getElementById(
            "fingerboardSelect"
        );

    const productIdInput =
        document.getElementById(
            "productId"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    const selectedProductInfo =
        document.getElementById(
            "selectedProductInfo"
        );

    const selectedProductText =
        document.getElementById(
            "selectedProductText"
        );

    const productErrorMessage =
        document.getElementById(
            "productErrorMessage"
        );

    /*
     * 製品名からシリーズを判定する。
     */
    function getSeries(productName) {
        if (productName.includes(
                "Traditional")) {
            return "Traditional";
        }

        if (productName.includes(
                "Hybrid II")) {
            return "Hybrid II";
        }

        return "その他";
    }

    /*
     * selectへoptionを追加する。
     */
    function appendOption(
            selectElement,
            value,
            text) {

        const option =
            document.createElement(
                "option"
            );

        option.value = value;
        option.textContent = text;

        selectElement.appendChild(
            option
        );
    }

    /*
     * モデル選択を初期化する。
     */
    function resetModelSelect() {
        modelSelect.innerHTML =
            '<option value="">'
            + '先にシリーズを選択してください'
            + '</option>';

        modelSelect.disabled = true;
    }

    /*
     * カラー選択を初期化する。
     */
    function resetColorSelect() {
        colorSelect.innerHTML =
            '<option value="">'
            + '先にモデルを選択してください'
            + '</option>';

        colorSelect.disabled = true;
    }

    /*
     * 指板材選択を初期化する。
     */
    function resetFingerboardSelect() {
        fingerboardSelect.innerHTML =
            '<option value="">'
            + '先にカラーを選択してください'
            + '</option>';

        fingerboardSelect.disabled = true;
    }

    /*
     * 確定済みProductを解除する。
     */
    function resetSelectedProduct() {
        productIdInput.value = "";
        registerButton.disabled = true;
        selectedProductInfo.hidden = true;
        selectedProductText.textContent =
            "";
        productErrorMessage.hidden = true;
        productErrorMessage.textContent =
            "";
    }

    /*
     * エラーを表示する。
     */
    function showProductError(message) {
        resetSelectedProduct();

        productErrorMessage.textContent =
            message;
        productErrorMessage.hidden = false;
    }

    /*
     * Productを確定する。
     */
    function selectProduct(product) {
        if (product == null) {
            showProductError(
                "対象となる製品が見つかりません。"
            );
            return;
        }

        productIdInput.value =
            product.id;

        selectedProductText.textContent =
            product.modelNo
            + " / "
            + product.productName
            + " / "
            + product.color
            + " / "
            + product.fingerboardMaterial;

        selectedProductInfo.hidden =
            false;
        productErrorMessage.hidden =
            true;
        registerButton.disabled =
            false;
    }

    /*
     * シリーズ一覧を生成する。
     */
    function initializeSeriesSelect() {
        const seriesNames = [
            ...new Set(
                products.map(
                    product =>
                        getSeries(
                            product.productName
                        )
                )
            )
        ];

        seriesNames.forEach(series => {
            appendOption(
                seriesSelect,
                series,
                series
            );
        });
    }

    /*
     * シリーズ変更
     */
    seriesSelect.addEventListener(
        "change",
        function () {
            resetModelSelect();
            resetColorSelect();
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedSeries =
                seriesSelect.value;

            if (selectedSeries === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        getSeries(
                            product.productName
                        ) === selectedSeries
                );

            const modelNames = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product.productName
                    )
                )
            ];

            modelSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            modelNames.forEach(
                modelName => {
                    appendOption(
                        modelSelect,
                        modelName,
                        modelName
                    );
                }
            );

            modelSelect.disabled = false;
        }
    );

    /*
     * モデル変更
     */
    modelSelect.addEventListener(
        "change",
        function () {
            resetColorSelect();
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedModel =
                modelSelect.value;

            if (selectedModel === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        product.productName
                        === selectedModel
                );

            /*
             * 同じカラーを重複表示しない。
             */
            const colors = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product.color
                    )
                )
            ];

            colorSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            colors.forEach(color => {
                appendOption(
                    colorSelect,
                    color,
                    color
                );
            });

            colorSelect.disabled = false;
        }
    );

    /*
     * カラー変更
     */
    colorSelect.addEventListener(
        "change",
        function () {
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedModel =
                modelSelect.value;

            const selectedColor =
                colorSelect.value;

            if (selectedModel === ""
                    || selectedColor === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        product.productName
                            === selectedModel
                        && product.color
                            === selectedColor
                );

            if (matchingProducts.length === 0) {
                showProductError(
                    "選択条件に対応する"
                    + "製品がありません。"
                );
                return;
            }

            /*
             * 指板材を重複なしで取得する。
             */
            const fingerboardMaterials = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product
                                .fingerboardMaterial
                    )
                )
            ];

            /*
             * 指板材が1種類の場合は自動選択する。
             */
            if (fingerboardMaterials.length
                    === 1) {

                const fingerboard =
                    fingerboardMaterials[0];

                /*
                 * 同じモデル・色・指板材で
                 * Productが複数ないか確認する。
                 */
                const exactProducts =
                    matchingProducts.filter(
                        product =>
                            product
                                .fingerboardMaterial
                            === fingerboard
                    );

                if (exactProducts.length !== 1) {
                    showProductError(
                        "同一仕様の製品マスタが"
                        + "複数登録されています。"
                    );
                    return;
                }

                fingerboardSelect.innerHTML =
                    "";

                appendOption(
                    fingerboardSelect,
                    exactProducts[0].id,
                    fingerboard
                        + "（自動選択）"
                );

                fingerboardSelect.value =
                    String(
                        exactProducts[0].id
                    );

                /*
                 * Product IDはhiddenで送るため、
                 * selectがdisabledでも問題ない。
                 */
                fingerboardSelect.disabled =
                    true;

                selectProduct(
                    exactProducts[0]
                );

                return;
            }

            /*
             * 指板材が複数ある場合は
             * ユーザーに選択させる。
             */
            fingerboardSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            fingerboardMaterials.forEach(
                fingerboard => {

                    const exactProducts =
                        matchingProducts.filter(
                            product =>
                                product
                                    .fingerboardMaterial
                                === fingerboard
                        );

                    /*
                     * 同一指板材でProductが
                     * 1件の場合だけ候補へ追加する。
                     */
                    if (exactProducts.length === 1) {
                        appendOption(
                            fingerboardSelect,
                            exactProducts[0].id,
                            fingerboard
                        );
                    }
                }
            );

            fingerboardSelect.disabled =
                false;
        }
    );

    /*
     * 指板材変更
     */
    fingerboardSelect.addEventListener(
        "change",
        function () {
            resetSelectedProduct();

            const selectedProductId =
                fingerboardSelect.value;

            if (selectedProductId === "") {
                return;
            }

            const selectedProduct =
                products.find(
                    product =>
                        String(product.id)
                        === selectedProductId
                );

            selectProduct(
                selectedProduct
            );
        }
    );

    const plannedStartDateInput = document.getElementById("plannedStartDate");
    const dueDateInput = document.getElementById("dueDate");
    const plannedStartDatePicker = document.getElementById("plannedStartDatePicker");
    const dueDatePicker = document.getElementById("dueDatePicker");

    function normalizeDate(value) {
        const digits = value.replace(/[^0-9]/g, "");
        if (digits.length !== 8) return null;
        const year = Number(digits.slice(0, 4));
        const month = Number(digits.slice(4, 6));
        const day = Number(digits.slice(6, 8));
        const date = new Date(Date.UTC(year, month - 1, day));
        if (date.getUTCFullYear() !== year || date.getUTCMonth() + 1 !== month
                || date.getUTCDate() !== day) return null;
        return `${digits.slice(0, 4)}/${digits.slice(4, 6)}/${digits.slice(6, 8)}`;
    }
    const toIso = value => value.replaceAll("/", "-");
    const toSlash = value => value.replaceAll("-", "/");

    function validateDate(input, picker) {
        const normalized = normalizeDate(input.value);
        if (normalized == null) {
            input.setCustomValidity("日付はyyyy/MM/dd形式で正しく入力してください。");
            return null;
        }
        const iso = toIso(normalized);
        if ((picker.min && iso < picker.min) || (picker.max && iso > picker.max)) {
            input.setCustomValidity("日付が入力可能範囲外です。");
            return null;
        }
        input.value = normalized;
        picker.value = iso;
        input.setCustomValidity("");
        return iso;
    }

    function connectDate(text, picker, button) {
        text.addEventListener("input", () => {
            text.value = text.value
                    .replace(/[^0-9\/-]/g, "")
                    .slice(0, 10);
            text.setCustomValidity("");
        });
        validateDate(text, picker);
        text.addEventListener("blur", () => validateDate(text, picker));
        picker.addEventListener("change", () => {
            text.value = toSlash(picker.value);
            text.setCustomValidity("");
            updateDueMinimum();
        });
        button.addEventListener("click", () => {
            const normalized = normalizeDate(text.value);
            if (normalized == null) {
                picker.value = "";
            } else {
                picker.value = toIso(normalized);
            }
            picker.showPicker();
        });
    }

    function updateDueMinimum() {
        const start = validateDate(plannedStartDateInput, plannedStartDatePicker);
        if (start != null) dueDatePicker.min = start;
        validateDate(dueDateInput, dueDatePicker);
    }

    connectDate(
        plannedStartDateInput,
        plannedStartDatePicker,
        document.getElementById("plannedStartDateButton")
    );
    connectDate(
        dueDateInput,
        dueDatePicker,
        document.getElementById("dueDateButton")
    );
    plannedStartDateInput.addEventListener("change", updateDueMinimum);
    updateDueMinimum();

    /*
     * 登録時の最終検証
     */
    document
        .getElementById(
            "productionOrderForm"
        )
        .addEventListener(
            "submit",
            function (event) {
                if (productIdInput.value === "") {
                    event.preventDefault();

                    alert(
                        "シリーズ、モデル、カラー、"
                        + "指板材を確定してください。"
                    );

                    return;
                }

                const plannedStartDate =
                    document.getElementById(
                        "plannedStartDate"
                    ).value;

                const dueDate =
                    document.getElementById(
                        "dueDate"
                    ).value;

                const plannedStartDateIso =
                    validateDate(plannedStartDateInput, plannedStartDatePicker);
                const dueDateIso =
                    validateDate(dueDateInput, dueDatePicker);
                if (plannedStartDateIso == null || dueDateIso == null) {
                    event.preventDefault();
                    return;
                }
                if (dueDateIso < plannedStartDateIso) {

                    event.preventDefault();

                    alert(
                        "納期は開始予定日以降に"
                        + "してください。"
                    );
                }
            }
        );

    initializeSeriesSelect();
</script>
</body>
</html>
