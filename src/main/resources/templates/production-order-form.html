<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        生産計画登録
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>
<div th:replace=
     "~{fragments/header :: header('生産計画登録')}">
</div>

<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">
            対象製品と計画内容を指定して、
            新しい生産計画を登録します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/production-orders/view}">
                生産計画一覧へ戻る
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}"
         class="empty-state">
        <p>
            登録可能な製品マスタがありません。
        </p>

        <a class="btn btn-primary"
           th:href="@{/products/new}">
            製品マスタを登録する
        </a>
    </div>

    <form th:if="${not #lists.isEmpty(products)}"
          th:action="@{/production-orders/create}"
          method="post"
          id="productionOrderForm"
          class="form-container">

        <section class="form-section">
            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Product
                    </p>
                    <h2 class="form-section-title">
                        対象製品
                    </h2>
                </div>

                <p class="form-section-description">
                    シリーズから順番に製品仕様を選択してください。
                </p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="seriesSelect"
                           class="form-label">
                        シリーズ
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="seriesSelect"
                            class="form-select"
                            required>
                        <option value="">
                            選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modelSelect"
                           class="form-label">
                        モデル
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="modelSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にシリーズを選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colorSelect"
                           class="form-label">
                        カラー
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="colorSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にモデルを選択してください
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fingerboardSelect"
                           class="form-label">
                        指板材
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="fingerboardSelect"
                            class="form-select"
                            required
                            disabled>
                        <option value="">
                            先にカラーを選択してください
                        </option>
                    </select>
                </div>
            </div>

            <input type="hidden"
                   id="productId"
                   name="productId">

            <div id="selectedProductInfo"
                 class="selected-product-info"
                 hidden>
                <div class="selected-product-label">
                    選択製品
                </div>

                <strong id="selectedProductText"
                        class="selected-product-value">
                </strong>
            </div>

            <p id="productErrorMessage"
               class="error-message"
               hidden>
            </p>
        </section>

        <section class="form-section">
            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Production Plan
                    </p>
                    <h2 class="form-section-title">
                        計画内容
                    </h2>
                </div>

                <p class="form-section-description">
                    計画数量と製造予定期間を入力してください。
                </p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="plannedQuantity"
                           class="form-label">
                        計画数
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <div class="form-input-with-unit">
                        <input type="number"
                               id="plannedQuantity"
                               name="plannedQuantity"
                               class="form-input"
                               min="1"
                               required>

                        <span class="form-input-unit">
                            台
                        </span>
                    </div>

                    <p class="form-help">
                        1台以上の計画数量を入力してください。
                    </p>
                </div>

                <div class="form-group">
                    <label for="plannedStartDate"
                           class="form-label">
                        開始予定日
                    </label>

                    <input type="date"
                           id="plannedStartDate"
                           name="plannedStartDate"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label for="dueDate"
                           class="form-label">
                        納期
                    </label>

                    <input type="date"
                           id="dueDate"
                           name="dueDate"
                           class="form-input">

                    <p class="form-help">
                        開始予定日以降の日付を指定してください。
                    </p>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <a class="btn btn-outline"
               th:href="@{/production-orders/view}">
                キャンセル
            </a>

            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary"
                    disabled>
                生産計画を登録
            </button>
        </div>
    </form>
</main>

<script th:inline="javascript">
    const products =
        /*[[${products}]]*/ [];

    const seriesSelect =
        document.getElementById(
            "seriesSelect"
        );

    const modelSelect =
        document.getElementById(
            "modelSelect"
        );

    const colorSelect =
        document.getElementById(
            "colorSelect"
        );

    const fingerboardSelect =
        document.getElementById(
            "fingerboardSelect"
        );

    const productIdInput =
        document.getElementById(
            "productId"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    const selectedProductInfo =
        document.getElementById(
            "selectedProductInfo"
        );

    const selectedProductText =
        document.getElementById(
            "selectedProductText"
        );

    const productErrorMessage =
        document.getElementById(
            "productErrorMessage"
        );

    /*
     * 製品名からシリーズを判定する。
     */
    function getSeries(productName) {
        if (productName.includes(
                "Traditional")) {
            return "Traditional";
        }

        if (productName.includes(
                "Hybrid II")) {
            return "Hybrid II";
        }

        return "その他";
    }

    /*
     * selectへoptionを追加する。
     */
    function appendOption(
            selectElement,
            value,
            text) {

        const option =
            document.createElement(
                "option"
            );

        option.value = value;
        option.textContent = text;

        selectElement.appendChild(
            option
        );
    }

    /*
     * モデル選択を初期化する。
     */
    function resetModelSelect() {
        modelSelect.innerHTML =
            '<option value="">'
            + '先にシリーズを選択してください'
            + '</option>';

        modelSelect.disabled = true;
    }

    /*
     * カラー選択を初期化する。
     */
    function resetColorSelect() {
        colorSelect.innerHTML =
            '<option value="">'
            + '先にモデルを選択してください'
            + '</option>';

        colorSelect.disabled = true;
    }

    /*
     * 指板材選択を初期化する。
     */
    function resetFingerboardSelect() {
        fingerboardSelect.innerHTML =
            '<option value="">'
            + '先にカラーを選択してください'
            + '</option>';

        fingerboardSelect.disabled = true;
    }

    /*
     * 確定済みProductを解除する。
     */
    function resetSelectedProduct() {
        productIdInput.value = "";
        registerButton.disabled = true;
        selectedProductInfo.hidden = true;
        selectedProductText.textContent =
            "";
        productErrorMessage.hidden = true;
        productErrorMessage.textContent =
            "";
    }

    /*
     * エラーを表示する。
     */
    function showProductError(message) {
        resetSelectedProduct();

        productErrorMessage.textContent =
            message;
        productErrorMessage.hidden = false;
    }

    /*
     * Productを確定する。
     */
    function selectProduct(product) {
        if (product == null) {
            showProductError(
                "対象となる製品が見つかりません。"
            );
            return;
        }

        productIdInput.value =
            product.id;

        selectedProductText.textContent =
            product.modelNo
            + " / "
            + product.productName
            + " / "
            + product.color
            + " / "
            + product.fingerboardMaterial;

        selectedProductInfo.hidden =
            false;
        productErrorMessage.hidden =
            true;
        registerButton.disabled =
            false;
    }

    /*
     * シリーズ一覧を生成する。
     */
    function initializeSeriesSelect() {
        const seriesNames = [
            ...new Set(
                products.map(
                    product =>
                        getSeries(
                            product.productName
                        )
                )
            )
        ];

        seriesNames.forEach(series => {
            appendOption(
                seriesSelect,
                series,
                series
            );
        });
    }

    /*
     * シリーズ変更
     */
    seriesSelect.addEventListener(
        "change",
        function () {
            resetModelSelect();
            resetColorSelect();
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedSeries =
                seriesSelect.value;

            if (selectedSeries === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        getSeries(
                            product.productName
                        ) === selectedSeries
                );

            const modelNames = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product.productName
                    )
                )
            ];

            modelSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            modelNames.forEach(
                modelName => {
                    appendOption(
                        modelSelect,
                        modelName,
                        modelName
                    );
                }
            );

            modelSelect.disabled = false;
        }
    );

    /*
     * モデル変更
     */
    modelSelect.addEventListener(
        "change",
        function () {
            resetColorSelect();
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedModel =
                modelSelect.value;

            if (selectedModel === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        product.productName
                        === selectedModel
                );

            /*
             * 同じカラーを重複表示しない。
             */
            const colors = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product.color
                    )
                )
            ];

            colorSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            colors.forEach(color => {
                appendOption(
                    colorSelect,
                    color,
                    color
                );
            });

            colorSelect.disabled = false;
        }
    );

    /*
     * カラー変更
     */
    colorSelect.addEventListener(
        "change",
        function () {
            resetFingerboardSelect();
            resetSelectedProduct();

            const selectedModel =
                modelSelect.value;

            const selectedColor =
                colorSelect.value;

            if (selectedModel === ""
                    || selectedColor === "") {
                return;
            }

            const matchingProducts =
                products.filter(
                    product =>
                        product.productName
                            === selectedModel
                        && product.color
                            === selectedColor
                );

            if (matchingProducts.length === 0) {
                showProductError(
                    "選択条件に対応する"
                    + "製品がありません。"
                );
                return;
            }

            /*
             * 指板材を重複なしで取得する。
             */
            const fingerboardMaterials = [
                ...new Set(
                    matchingProducts.map(
                        product =>
                            product
                                .fingerboardMaterial
                    )
                )
            ];

            /*
             * 指板材が1種類の場合は自動選択する。
             */
            if (fingerboardMaterials.length
                    === 1) {

                const fingerboard =
                    fingerboardMaterials[0];

                /*
                 * 同じモデル・色・指板材で
                 * Productが複数ないか確認する。
                 */
                const exactProducts =
                    matchingProducts.filter(
                        product =>
                            product
                                .fingerboardMaterial
                            === fingerboard
                    );

                if (exactProducts.length !== 1) {
                    showProductError(
                        "同一仕様の製品マスタが"
                        + "複数登録されています。"
                    );
                    return;
                }

                fingerboardSelect.innerHTML =
                    "";

                appendOption(
                    fingerboardSelect,
                    exactProducts[0].id,
                    fingerboard
                        + "（自動選択）"
                );

                fingerboardSelect.value =
                    String(
                        exactProducts[0].id
                    );

                /*
                 * Product IDはhiddenで送るため、
                 * selectがdisabledでも問題ない。
                 */
                fingerboardSelect.disabled =
                    true;

                selectProduct(
                    exactProducts[0]
                );

                return;
            }

            /*
             * 指板材が複数ある場合は
             * ユーザーに選択させる。
             */
            fingerboardSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            fingerboardMaterials.forEach(
                fingerboard => {

                    const exactProducts =
                        matchingProducts.filter(
                            product =>
                                product
                                    .fingerboardMaterial
                                === fingerboard
                        );

                    /*
                     * 同一指板材でProductが
                     * 1件の場合だけ候補へ追加する。
                     */
                    if (exactProducts.length === 1) {
                        appendOption(
                            fingerboardSelect,
                            exactProducts[0].id,
                            fingerboard
                        );
                    }
                }
            );

            fingerboardSelect.disabled =
                false;
        }
    );

    /*
     * 指板材変更
     */
    fingerboardSelect.addEventListener(
        "change",
        function () {
            resetSelectedProduct();

            const selectedProductId =
                fingerboardSelect.value;

            if (selectedProductId === "") {
                return;
            }

            const selectedProduct =
                products.find(
                    product =>
                        String(product.id)
                        === selectedProductId
                );

            selectProduct(
                selectedProduct
            );
        }
    );

    /*
     * 登録時の最終検証
     */
    document
        .getElementById(
            "productionOrderForm"
        )
        .addEventListener(
            "submit",
            function (event) {
                if (productIdInput.value === "") {
                    event.preventDefault();

                    alert(
                        "シリーズ、モデル、カラー、"
                        + "指板材を確定してください。"
                    );

                    return;
                }

                const plannedStartDate =
                    document.getElementById(
                        "plannedStartDate"
                    ).value;

                const dueDate =
                    document.getElementById(
                        "dueDate"
                    ).value;

                if (plannedStartDate !== ""
                        && dueDate !== ""
                        && dueDate
                            < plannedStartDate) {

                    event.preventDefault();

                    alert(
                        "納期は開始予定日以降に"
                        + "してください。"
                    );
                }
            }
        );

    initializeSeriesSelect();
</script>
</body>
</html>
