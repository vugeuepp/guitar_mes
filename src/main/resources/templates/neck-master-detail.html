<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ネックマスタ詳細
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ネックマスタ詳細')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ネックマスタの仕様情報を確認できます。
        </p>

        <div class="page-toolbar-actions">

            <a class="btn btn-outline"
               th:href="@{/neck-masters/view}">
                ネックマスタ一覧へ戻る
            </a>

        </div>

    </div>

    <section class="detail-section">

        <div class="detail-section-heading">

            <div>

                <p class="detail-section-caption">
                    Neck Master Information
                </p>

                <h2 class="detail-section-title"
                    th:text="${neckMaster.modelCode}">
                </h2>

            </div>

        </div>

        <div class="detail-grid">

            <div class="detail-item">

                <div class="detail-label">
                    モデルコード
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.modelCode}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    モデル名
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.modelName}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    ネックタイプ
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.neckType}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    ネック材
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.neckMaterial}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    指板材
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.fingerboardMaterial}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    フレット数
                </div>

                <div class="detail-value"
                     th:text="${neckMaster.fretCount}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    スケール
                </div>

                <div class="detail-value"
                     th:text="${#strings.isEmpty(neckMaster.scale)
                                ? '-'
                                : neckMaster.scale + 'インチ'}">
                </div>

            </div>

        </div>

    </section>

    <div class="detail-footer-actions">

        <a class="btn btn-outline"
           th:href="@{/neck-masters/view}">
            ネックマスタ一覧へ戻る
        </a>

    </div>

</main>

</body>
</html>
