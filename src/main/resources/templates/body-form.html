<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ボディ登録
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ボディ登録')}">
</div>

<main class="page-container">

    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ボディマスタを選択して、
            新しいボディ個体を登録します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/bodies/view}">
                ボディ一覧へ戻る
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(bodyMasters)}"
         class="empty-state">

        <p>
            登録可能なボディマスタがありません。
        </p>

        <a class="btn btn-primary"
           th:href="@{/body-masters/new}">
            ボディマスタを登録する
        </a>

    </div>

    <form th:if="${not #lists.isEmpty(bodyMasters)}"
          th:action="@{/bodies/create}"
          method="post"
          id="bodyForm"
          class="form-container">

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Body Identification
                    </p>

                    <h2 class="form-section-title">
                        個体情報
                    </h2>
                </div>

                <p class="form-section-description">
                    シリアル番号は登録時に自動採番されます。
                </p>
            </div>

            <div class="information-message">
                <p>
                    シリアル番号は登録時に自動採番されます。
                </p>
            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Body Specification
                    </p>

                    <h2 class="form-section-title">
                        ボディ仕様
                    </h2>
                </div>

                <p class="form-section-description">
                    シリーズ、モデル、カラーの順に
                    対象ボディを選択してください。
                </p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="seriesSelect"
                           class="form-label">
                        シリーズ

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="seriesSelect"
                            class="form-select"
                            required>

                        <option value="">
                            選択してください
                        </option>

                        <option value="Traditional">
                            Traditional
                        </option>

                        <option value="Hybrid II">
                            Hybrid II
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="modelSelect"
                           class="form-label">
                        モデル

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="modelSelect"
                            class="form-select"
                            required
                            disabled>

                        <option value="">
                            先にシリーズを選択してください
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="colorSelect"
                           class="form-label">
                        カラー

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="colorSelect"
                            class="form-select"
                            required
                            disabled>

                        <option value="">
                            先にモデルを選択してください
                        </option>

                    </select>
                </div>

            </div>

            <input type="hidden"
                   id="bodyMasterId"
                   name="bodyMasterId">

        </section>

        <div class="form-actions">

            <a class="btn btn-outline"
               th:href="@{/bodies/view}">
                キャンセル
            </a>

            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary"
                    disabled>
                ボディを登録
            </button>

        </div>

    </form>

</main>

<script th:inline="javascript">
    const bodyMasters =
        /*[[${bodyMasters}]]*/ [];

    const seriesSelect =
        document.getElementById(
            "seriesSelect"
        );

    const modelSelect =
        document.getElementById(
            "modelSelect"
        );

    const colorSelect =
        document.getElementById(
            "colorSelect"
        );

    const bodyMasterIdInput =
        document.getElementById(
            "bodyMasterId"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    function resetModelSelect() {
        modelSelect.innerHTML =
            '<option value="">'
            + '先にシリーズを選択してください'
            + '</option>';

        modelSelect.disabled = true;
    }

    function resetColorSelect() {
        colorSelect.innerHTML =
            '<option value="">'
            + '先にモデルを選択してください'
            + '</option>';

        colorSelect.disabled = true;
    }

    function resetSelectedBodyMaster() {
        bodyMasterIdInput.value = "";
        registerButton.disabled = true;
    }

    function getBaseModelName(modelName) {
        return modelName.replace(
            / Body$/,
            ""
        );
    }

    seriesSelect.addEventListener(
        "change",
        function () {
            resetModelSelect();
            resetColorSelect();
            resetSelectedBodyMaster();

            const selectedSeries =
                seriesSelect.value;

            if (selectedSeries === "") {
                return;
            }

            const matchingMasters =
                bodyMasters.filter(
                    bodyMaster =>
                        bodyMaster.modelName.includes(
                            selectedSeries
                        )
                );

            const modelNames = [
                ...new Set(
                    matchingMasters.map(
                        bodyMaster =>
                            getBaseModelName(
                                bodyMaster.modelName
                            )
                    )
                )
            ];

            modelSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            modelNames.forEach(
                modelName => {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = modelName;
                    option.textContent = modelName;

                    modelSelect.appendChild(
                        option
                    );
                }
            );

            modelSelect.disabled = false;
        }
    );

    modelSelect.addEventListener(
        "change",
        function () {
            resetColorSelect();
            resetSelectedBodyMaster();

            const selectedModel =
                modelSelect.value;

            if (selectedModel === "") {
                return;
            }

            const matchingMasters =
                bodyMasters.filter(
                    bodyMaster =>
                        getBaseModelName(
                            bodyMaster.modelName
                        ) === selectedModel
                );

            colorSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            matchingMasters.forEach(
                bodyMaster => {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        bodyMaster.id;

                    option.textContent =
                        bodyMaster.color;

                    colorSelect.appendChild(
                        option
                    );
                }
            );

            colorSelect.disabled = false;
        }
    );

    colorSelect.addEventListener(
        "change",
        function () {
            const selectedBodyMasterId =
                colorSelect.value;

            bodyMasterIdInput.value =
                selectedBodyMasterId;

            registerButton.disabled =
                selectedBodyMasterId === "";
        }
    );

    document
        .getElementById(
            "bodyForm"
        )
        .addEventListener(
            "submit",
            function (event) {
                if (bodyMasterIdInput.value === "") {
                    event.preventDefault();

                    alert(
                        "シリーズ、モデル、カラーを"
                        + "選択してください。"
                    );
                }
            }
        );
</script>

</body>
</html>
