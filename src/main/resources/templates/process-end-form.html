<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        工程終了
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('工程終了')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            実施中の工程を終了します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/guitars/view}">
                ギター一覧へ戻る
            </a>

            <a class="btn btn-outline"
               th:href="@{/}">
                Home
            </a>
        </div>

    </div>

    <!-- ギター指定あり：実施中工程あり -->
    <section th:if="${runningHistory != null}"
             class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Running Process
                </p>

                <h2 class="detail-section-title">
                    対象ギターの実施中工程
                </h2>
            </div>

        </div>

        <div class="table-container">

            <table class="data-table">

                <thead>
                <tr>
                    <th>
                        履歴ID
                    </th>
                    <th>
                        工程ID
                    </th>
                    <th>
                        作業者
                    </th>
                    <th>
                        開始時刻
                    </th>
                    <th>
                        終了
                    </th>
                </tr>
                </thead>

                <tbody>

                <tr>

                    <td th:text="${runningHistory.id}">
                    </td>

                    <td th:text="${runningHistory.processId}">
                    </td>

                    <td th:text="${runningHistory.workerName}">
                    </td>

                    <td th:text="${runningHistory.startTime}">
                    </td>

                    <td class="table-action-cell">

                        <form th:action="@{/processes/end}"
                              method="post">

                            <input type="hidden"
                                   name="historyId"
                                   th:value="${runningHistory.id}">

                            <button type="submit"
                                    class="btn btn-process-end">
                                工程終了
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- ギター指定あり：実施中工程なし -->
    <div th:if="${guitarSpecified == true
                 and runningHistory == null}"
         class="empty-state">

        <p>
            このギターには現在実施中の工程がありません。
        </p>

    </div>

    <!-- ギター指定なし：全実施中工程 -->
    <section th:if="${guitarSpecified == false}"
             class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Running Processes
                </p>

                <h2 class="detail-section-title">
                    実施中工程一覧
                </h2>
            </div>

            <div class="detail-section-count">
                <span th:text="${#lists.size(histories)}">
                </span>
                <span>
                    件
                </span>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(histories)}"
             class="empty-state">

            <p>
                現在実施中の工程はありません。
            </p>

        </div>

        <div th:if="${not #lists.isEmpty(histories)}"
             class="table-container">

            <table class="data-table">

                <thead>
                <tr>
                    <th>
                        履歴ID
                    </th>
                    <th>
                        工程ID
                    </th>
                    <th>
                        作業者
                    </th>
                    <th>
                        開始時刻
                    </th>
                    <th>
                        終了
                    </th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="history : ${histories}">

                    <td th:text="${history.id}">
                    </td>

                    <td th:text="${history.processId}">
                    </td>

                    <td th:text="${history.workerName}">
                    </td>

                    <td th:text="${history.startTime}">
                    </td>

                    <td class="table-action-cell">

                        <form th:action="@{/processes/end}"
                              method="post">

                            <input type="hidden"
                                   name="historyId"
                                   th:value="${history.id}">

                            <button type="submit"
                                    class="btn btn-process-end">
                                工程終了
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
