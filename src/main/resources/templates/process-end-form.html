<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>工程終了</title>
</head>

<body>

<h1>工程終了</h1>

<!-- ギター指定あり：対象ギターの実施中工程がある場合 -->
<div th:if="${runningHistory != null}">

    <h2>対象ギターの実施中工程</h2>

    <table border="1">
        <tr>
            <th>履歴ID</th>
            <th>工程ID</th>
            <th>作業者</th>
            <th>開始時刻</th>
            <th>終了</th>
        </tr>

        <tr>
            <td th:text="${runningHistory.id}"></td>
            <td th:text="${runningHistory.processId}"></td>
            <td th:text="${runningHistory.workerName}"></td>
            <td th:text="${runningHistory.startTime}"></td>
            <td>
                <form th:action="@{/processes/end}" method="post">

                    <input type="hidden"
                           name="historyId"
                           th:value="${runningHistory.id}">

                    <button type="submit">
                        終了
                    </button>

                </form>
            </td>
        </tr>
    </table>

</div>

<!-- ギター指定あり：対象ギターに実施中工程がない場合 -->
<div th:if="${guitarSpecified == true and runningHistory == null}">

    <p>
        このギターには現在実施中の工程がありません。
    </p>

</div>

<!-- ギター指定なし：全ての実施中工程一覧 -->
<div th:if="${guitarSpecified == false}">

    <h2>実施中工程一覧</h2>

    <table border="1">
        <tr>
            <th>履歴ID</th>
            <th>工程ID</th>
            <th>作業者</th>
            <th>開始時刻</th>
            <th>終了</th>
        </tr>

        <tr th:each="history : ${histories}">
            <td th:text="${history.id}"></td>
            <td th:text="${history.processId}"></td>
            <td th:text="${history.workerName}"></td>
            <td th:text="${history.startTime}"></td>
            <td>
                <form th:action="@{/processes/end}" method="post">

                    <input type="hidden"
                           name="historyId"
                           th:value="${history.id}">

                    <button type="submit">
                        終了
                    </button>

                </form>
            </td>
        </tr>
    </table>

</div>

<br>

<a th:href="@{/guitars/view}">
    ギター一覧へ戻る
</a>

<br>

<a th:href="@{/}">
    Home
</a>

</body>
</html>
