<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程終了</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header('工程終了')}"></div>
<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">実施中の工程を終了します。</p>
        <div class="page-toolbar-actions">
            <a class="btn btn-outline" th:href="@{/guitars/view}">ギター一覧へ戻る</a>
            <a class="btn btn-outline" th:href="@{/}">Home</a>
        </div>
    </div>

    <section th:if="${runningHistory != null}" class="detail-section">
        <div class="detail-section-heading">
            <div>
                <p class="detail-section-caption">Running Process</p>
                <h2 class="detail-section-title">対象ギターの実施中工程</h2>
            </div>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th>ギター</th>
                    <th>工程名</th>
                    <th>作業者</th>
                    <th>開始時刻</th>
                    <th>終了</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td th:text="${runningHistory.guitarSerialNo}"></td>
                    <td th:text="${runningHistory.processName}"></td>
                    <td th:text="${runningHistory.workerName}"></td>
                    <td th:text="${runningHistory.startTime}"></td>
                    <td class="table-action-cell">
                        <form th:action="@{/processes/end}" method="post">
                            <input type="hidden" name="historyId" th:value="${runningHistory.historyId}">
                            <button type="submit" class="btn btn-process-end">工程終了</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div th:if="${guitarSpecified == true and runningHistory == null}" class="empty-state">
        <p>このギターには現在実施中の工程がありません。</p>
    </div>

    <section th:if="${guitarSpecified == false}" class="detail-section">
        <div class="detail-section-heading">
            <div>
                <p class="detail-section-caption">Running Processes</p>
                <h2 class="detail-section-title">実施中工程一覧</h2>
            </div>
            <div class="detail-section-count">
                <span th:text="${#lists.size(histories)}"></span><span>件</span>
            </div>
        </div>

        <div th:if="${successMessage}" class="success-message" role="status"
             th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="error-message" role="alert"
             th:text="${errorMessage}"></div>
        <div th:if="${#lists.isEmpty(histories)}" class="empty-state">
            <p>現在実施中の工程はありません。</p>
        </div>

        <form th:if="${not #lists.isEmpty(histories)}"
              th:action="@{/processes/bulk/end}"
              method="post"
              class="bulk-process-form"
              id="bulk-end-form">
            <section class="bulk-action-panel">
                <p class="form-help bulk-process-guidance">
                    先に対象工程を選択してください。選択した工程と一致するギターだけを一括選択できます。
                </p>
                <div class="form-group">
                    <label class="form-label" for="targetProcessId">対象工程</label>
                    <select id="targetProcessId" class="form-select" required>
                        <option value="">選択してください</option>
                        <option th:each="process : ${processes}"
                                th:if="${#lists.contains(histories.![processId], process.id)}"
                                th:value="${process.id}"
                                th:text="${process.processName}"
                                th:attr="data-process-name=${process.processName}"></option>
                    </select>
                </div>
                <div class="bulk-selection-count">
                    選択中: <strong id="selected-count">0</strong>件
                </div>
                <button type="submit" class="btn btn-process-end">一括工程終了</button>
            </section>
            <div class="table-container">
                <table class="data-table bulk-select-table">
                    <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all" aria-label="全件選択"></th>
                        <th>ギター</th>
                        <th>工程名</th>
                        <th>作業者</th>
                        <th>開始時刻</th>
                        <th>単体操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="history : ${histories}"
                        th:attr="data-history-id=${history.historyId},data-process-id=${history.processId}">
                        <td class="bulk-checkbox-cell">
                            <input type="checkbox"
                                   name="historyIds"
                                   class="row-checkbox"
                                   th:value="${history.historyId}"
                                   disabled
                                   th:attr="aria-label=${'工程履歴を選択'}">
                        </td>
                        <td th:text="${history.guitarSerialNo}"></td>
                        <td th:text="${history.processName}"></td>
                        <td th:text="${history.workerName}"></td>
                        <td th:text="${history.startTime}"></td>
                        <td class="table-action-cell">
                            <button type="submit"
                                    class="btn btn-process-end"
                                    th:formaction="@{/processes/end}"
                                    name="historyId"
                                    th:value="${history.historyId}">
                                工程終了
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </section>
</main>
<script th:inline="none">
(() => {
    const processSelect = document.getElementById('targetProcessId');
    const selectAll = document.getElementById('select-all');
    const boxes = Array.from(document.querySelectorAll('.row-checkbox'));
    const selectedCount = document.getElementById('selected-count');
    if (!processSelect || !selectAll || !selectedCount) return;

    const update = () => {
        const enabled = boxes.filter(box => !box.disabled);
        const checked = enabled.filter(box => box.checked);
        selectedCount.textContent = checked.length;
        selectAll.disabled = enabled.length === 0;
        selectAll.checked = enabled.length > 0 && checked.length === enabled.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < enabled.length;
    };

    const applyFilter = () => {
        const processId = processSelect.value;
        boxes.forEach(box => {
            const row = box.closest('tr');
            const matches = processId !== '' && row.dataset.processId === processId;
            box.checked = false;
            box.disabled = !matches;
            row.classList.toggle('is-disabled', !matches);
        });
        selectAll.checked = false;
        selectAll.indeterminate = false;
        update();
    };

    processSelect.addEventListener('change', applyFilter);
    selectAll.addEventListener('change', () => {
        boxes.filter(box => !box.disabled)
            .forEach(box => box.checked = selectAll.checked);
        update();
    });
    boxes.forEach(box => box.addEventListener('change', update));
    applyFilter();
})();
</script>
</body>
</html>
