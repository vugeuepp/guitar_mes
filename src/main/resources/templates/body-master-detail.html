<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ボディマスタ詳細
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ボディマスタ詳細')}">
</div>

<main class="page-container">

    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ボディマスタの仕様情報を確認できます。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-secondary"
               th:href="@{/body-masters/{id}/edit(id=${bodyMaster.id})}">
                編集
            </a>
            <a class="btn btn-outline"
               th:href="@{/body-masters/view}">
                ボディマスタ一覧へ戻る
            </a>
        </div>
    </div>

    <section class="detail-section">

        <div class="detail-section-heading">
            <div>
                <p class="detail-section-caption">
                    Body Master Information
                </p>

                <h2 class="detail-section-title"
                    th:text="${bodyMaster.modelCode}">
                </h2>
            </div>
        </div>

        <div class="detail-grid">

            <div class="detail-item">
                <div class="detail-label">
                    モデルコード
                </div>
                <div class="detail-value"
                     th:text="${bodyMaster.modelCode}">
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">
                    モデル名
                </div>
                <div class="detail-value"
                     th:text="${bodyMaster.modelName}">
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">
                    ボディタイプ
                </div>
                <div class="detail-value"
                     th:text="${bodyMaster.bodyType}">
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">
                    材質
                </div>
                <div class="detail-value"
                     th:text="${bodyMaster.material}">
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">
                    カラー
                </div>
                <div class="detail-value"
                     th:text="${bodyMaster.color}">
                </div>
            </div>

        </div>

    </section>

    <div class="detail-footer-actions">
        <a class="btn btn-outline"
           th:href="@{/body-masters/view}">
            ボディマスタ一覧へ戻る
        </a>
    </div>

</main>

</body>
</html>
