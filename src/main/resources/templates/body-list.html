<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ボディ一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace=
 "~{fragments/header :: header('ボディ一覧')}">
</div>
<p>
	<a th:href="@{/bodies/new}">
		新規ボディ登録
	</a>
</p>
<table border="1">
    <tr>
        <th>ID</th>
        <th>シリアル番号</th>
        <th>モデルコード</th>
        <th>モデル名</th>
        <th>ボディタイプ</th>
        <th>材質</th>
        <th>カラー</th>
        <th>現在工程</th>
        <th>ステータス</th>
		<th>工程操作</th>
		<th>履歴</th>
    </tr>

    <tr th:each="body : ${bodies}">
        <td th:text="${body.id}"></td>

        <td th:text="${body.serialNo}"></td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.modelCode
                : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.modelName
                : body.modelName}">
        </td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.bodyType : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null
                ? body.bodyMaster.material
                : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null
                ? body.bodyMaster.color
                : body.color}">
        </td>

        <td th:text="${body.currentProcess}"></td>
		<td>
		    <span class="status-badge"
		          th:classappend="${@statusDisplay.getCssClass(body.status)}"
		          th:text="${@statusDisplay.getLabel(body.status)}">
		    </span>
		</td>
		<td>

		    <!-- 作業中 -->
		    <form th:if="${body.status == 'WORKING'}"
		          th:action="@{/body-processes/end/view}"
		          method="get">

		        <input type="hidden"
		               name="bodyId"
		               th:value="${body.id}">

		        <button type="submit"
		                class="process-button process-end-button">
		            工程終了
		        </button>

		    </form>

		    <!-- 開始可能 -->
		    <form th:if="${body.status == 'WAITING'
		                  or body.status == 'WAITING_INSPECTION'
		                  or body.status == 'REWORK'}"
		          th:action="@{/body-processes/start/view}"
		          method="get">

		        <input type="hidden"
		               name="bodyId"
		               th:value="${body.id}">

		        <button type="submit"
		                class="process-button process-start-button">
		            工程開始
		        </button>

		    </form>

		    <!-- 操作不可 -->
		    <span th:if="${body.status == 'AVAILABLE'
		                  or body.status == 'ASSEMBLED'
		                  or body.status == 'REJECTED'}"
		          th:text="${@statusDisplay.getLabel(body.status)}">
		    </span>

		</td>
		<td>
		    <form th:action=
		          "@{/bodies/{id}/process-history(id=${body.id})}"
		          method="get">

		        <button type="submit"
		                class="history-button">
		            工程履歴
		        </button>

		    </form>
		</td>
    </tr>
</table>


<br>
</body>
</html>
