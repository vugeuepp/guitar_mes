<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ボディ一覧</title>
</head>
<body>
<h1>ボディ一覧</h1>
<p>
	<a th:href="@{/bodies/new}">
		新規ボディ登録
	</a>
</p>
<table border="1">
	<tr>
		<th>ID</th>
		<th>シリアル番号</th>
		<th>モデル</th>
		<th>現在工程</th>
		<th>カラー</th>
		<th>ステータス</th>
	</tr>
	
	<tr th:each="body : ${bodies}">
		<td th:text="${body.id}"></td>
		<td th:text="${body.serialNo}"></td>
		<td th:text="${body.modelName}"></td>
		<td th:text="${body.color}"></td>
		<td th:text="${body.currentProcess}"></td>
		<td th:text="${body.status}"></td>
	</tr>
</table>

<br>

<a th:href="@{/guitars/view}">
	ギター一覧へ
</a>
<br>

<a th:href="@{/necks/view}">
	ネック一覧へ
</a>
<br>
<a th:href="@{/assemblies/view}">
	Assembly一覧へ
</a>
<br>
<a th:href="@{/}">
	Home
</a>
</body>
</html>
