<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ボディ一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace=
 "~{fragments/header :: header('ボディ一覧')}">
</div>
<p>
	<a th:href="@{/bodies/new}">
		新規ボディ登録
	</a>
</p>
<table border="1">
    <tr>
        <th>ID</th>
        <th>シリアル番号</th>
        <th>モデルコード</th>
        <th>モデル名</th>
        <th>ボディタイプ</th>
        <th>材質</th>
        <th>カラー</th>
        <th>現在工程</th>
        <th>ステータス</th>
		<th>工程操作</th>
		<th>履歴</th>
    </tr>

    <tr th:each="body : ${bodies}">
        <td th:text="${body.id}"></td>

        <td th:text="${body.serialNo}"></td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.modelCode
                : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.modelName
                : body.modelName}">
        </td>

        <td th:text="${body.bodyMaster != null ? body.bodyMaster.bodyType : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null
                ? body.bodyMaster.material
                : '未設定'}">
        </td>

        <td th:text="${body.bodyMaster != null
                ? body.bodyMaster.color
                : body.color}">
        </td>

        <td th:text="${body.currentProcess}"></td>

		<td>

		    <span th:switch="${body.status}">

		        <span th:case="'WAITING'"
		              class="status-badge status-waiting">
		            工程待ち
		        </span>

		        <span th:case="'WORKING'"
		              class="status-badge status-working">
		            作業中
		        </span>

		        <span th:case="'WAITING_INSPECTION'"
		              class="status-badge status-inspection">
		            検品待ち
		        </span>

		        <span th:case="'REWORK'"
		              class="status-badge status-rework">
		            手直し待ち
		        </span>

		        <span th:case="'AVAILABLE'"
		              class="status-badge status-available">
		            組立待ち
		        </span>

		        <span th:case="'ASSEMBLED'"
		              class="status-badge status-assembled">
		            組立済み
		        </span>

		        <span th:case="'REJECTED'"
		              class="status-badge status-rejected">
		            製造終了
		        </span>

		        <span th:case="*"
		              class="status-badge"
		              th:text="${body.status}">
		        </span>

		    </span>

		</td>
		<td>
		    <!-- 工程実施中：終了だけ表示 -->
		    <form th:if="${body.status == 'WORKING'}"
		          th:action="@{/body-processes/end/view}"
		          method="get">

		        <input type="hidden"
		               name="bodyId"
		               th:value="${body.id}">

		        <button type="submit" class="process-button process-end-button">
		            工程終了
		        </button>
		    </form>

		    <!-- 待機状態：開始だけ表示 -->
		    <form th:if="${body.status == 'WAITING'
		                  or body.status == 'WAITING_INSPECTION'
		                  or body.status == 'REWORK'}"
		          th:action="@{/body-processes/start/view}"
		          method="get">

		        <input type="hidden"
		               name="bodyId"
		               th:value="${body.id}">

		        <button type="submit" class="process-button process-start-button">
		            工程開始
		        </button>
		    </form>

		    <!-- 全工程完了 -->
		    <span th:if="${body.status == 'AVAILABLE'}">
		        組立待ち
		    </span>

		    <!-- 組立済み -->
		    <span th:if="${body.status == 'ASSEMBLED'}">
		        組立済み
		    </span>

		    <!-- 不合格 -->
		    <span th:if="${body.status == 'REJECTED'}">
		        製造終了
		    </span>
		</td>
		<td>
		    <form th:action=
		          "@{/bodies/{id}/process-history(id=${body.id})}"
		          method="get">

		        <button type="submit"
		                class="history-button">
		            工程履歴
		        </button>

		    </form>
		</td>
    </tr>
</table>


<br>

<div th:replace="~{fragments/menu :: menu}">
</div>
</body>
</html>
