<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ボディ管理一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('ボディ管理一覧')}">
</div>

<main class="page-container">

    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ボディ個体の登録状況と工程進捗を確認できます。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-primary"
               th:href="@{/bodies/new}">
                新規ボディ登録
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(bodies)}"
         class="empty-state">
        <p>登録されているボディはありません。</p>
    </div>

    <div th:unless="${#lists.isEmpty(bodies)}"
         class="table-container">

        <table class="data-table body-management-table">

            <colgroup>
                <col class="body-column-id">
                <col class="body-column-serial">
                <col class="body-column-code">
                <col class="body-column-model">
                <col class="body-column-type">
                <col class="body-column-material">
                <col class="body-column-color">
                <col class="body-column-process">
                <col class="body-column-status">
                <col class="body-column-action">
                <col class="body-column-history">
            </colgroup>

            <thead>
            <tr>
                <th>ID</th>
                <th>シリアル番号</th>
                <th>モデルコード</th>
                <th>モデル名</th>
                <th>ボディタイプ</th>
                <th>材質</th>
                <th>カラー</th>
                <th>現在工程</th>
                <th>状態</th>
                <th>工程操作</th>
                <th>履歴</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="body : ${bodies}">

                <td th:text="${body.id}"></td>

                <td th:text="${body.serialNo}"></td>

                <td th:text="${body.bodyMaster != null
                              ? body.bodyMaster.modelCode
                              : '未設定'}">
                </td>

                <td th:text="${body.bodyMaster != null
                              ? body.bodyMaster.modelName
                              : body.modelName}">
                </td>

                <td th:text="${body.bodyMaster != null
                              ? body.bodyMaster.bodyType
                              : '未設定'}">
                </td>

                <td th:text="${body.bodyMaster != null
                              ? body.bodyMaster.material
                              : '未設定'}">
                </td>

                <td th:text="${body.bodyMaster != null
                              ? body.bodyMaster.color
                              : body.color}">
                </td>

                <td>
                    <span class="body-current-process"
                          th:text="${body.currentProcess}">
                    </span>
                </td>

                <td class="status-cell">
                    <span class="status-badge"
                          th:classappend="${@statusDisplay.getCssClass(body.status)}"
                          th:text="${@statusDisplay.getLabel(body.status)}">
                    </span>
                </td>

                <td>

                    <form th:if="${body.status == 'WORKING'}"
                          th:action="@{/body-processes/end/view}"
                          method="get">

                        <input type="hidden"
                               name="bodyId"
                               th:value="${body.id}">

                        <button type="submit"
                                class="btn btn-process-end">
                            工程終了
                        </button>

                    </form>

                    <form th:if="${body.status == 'WAITING'
                                  or body.status == 'WAITING_INSPECTION'
                                  or body.status == 'REWORK'}"
                          th:action="@{/body-processes/start/view}"
                          method="get">

                        <input type="hidden"
                               name="bodyId"
                               th:value="${body.id}">

                        <button type="submit"
                                class="btn btn-primary">
                            工程開始
                        </button>

                    </form>

                    <span class="list-no-action"
                          th:if="${body.status == 'AVAILABLE'
                                or body.status == 'ASSEMBLED'
                                or body.status == 'REJECTED'}">
                        操作不可
                    </span>

                </td>

                <td>

                    <form th:action="@{/bodies/{id}/process-history(id=${body.id})}"
                          method="get">

                        <button type="submit"
                                class="btn btn-detail">
                            工程履歴
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
