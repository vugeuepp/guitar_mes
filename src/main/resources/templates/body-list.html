<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ボディ管理一覧</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header('ボディ管理一覧')}"></div>
<main class="page-container">
<div class="page-toolbar">
<p class="page-toolbar-description" th:text="${category == 'active'} ? '通常工程で対応中のボディを確認・処理できます。' : (${category == 'attention'} ? '確認や復帰対応が必要なボディを確認できます。' : 'ボディ工程を通過した個体と履歴を確認できます。')"></p>
<div class="page-toolbar-actions"><a class="btn btn-primary" th:href="@{/bodies/new}">新規ボディ登録</a></div>
</div>
<div th:if="${successMessage}" class="success-message" role="status" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="error-message" role="alert" th:text="${errorMessage}"></div>
<section id="category-search-panel" class="guitar-search-panel" aria-label="ボディ検索・フィルタ">
<form class="guitar-search-form" method="get" th:action="@{/bodies/view}">
<input type="hidden" name="category" th:value="${category}">
<div class="form-group"><label class="form-label" for="serial">シリアル番号</label><input class="form-input" id="serial" name="serial" type="search" th:value="${serial}" placeholder="例: DB260001"></div>
<div class="form-group"><label class="form-label" for="modelName">モデル名</label><input class="form-input" id="modelName" name="modelName" type="search" th:value="${modelName}" placeholder="モデル名を入力"></div>
<div class="form-group"><label class="form-label" for="currentProcess">現在工程</label><select class="form-select" id="currentProcess" name="currentProcess"><option value="">すべて</option><option th:each="process : ${bodyProcesses}" th:value="${process.processName}" th:text="${process.processName}" th:selected="${process.processName == selectedCurrentProcess}"></option><option value="組立待ち" th:selected="${selectedCurrentProcess == '組立待ち'}">組立待ち</option><option value="製造終了" th:selected="${selectedCurrentProcess == '製造終了'}">製造終了</option></select></div>
<div class="form-group"><label class="form-label" for="status">状態</label><select class="form-select" id="status" name="status"><option value="">すべて</option><option value="WAITING_INSPECTION" th:selected="${selectedStatus == 'WAITING_INSPECTION'}">検品待ち</option><option value="REWORK" th:selected="${selectedStatus == 'REWORK'}">手直し待ち</option><option value="RETURNED" th:selected="${selectedStatus == 'RETURNED'}">差し戻し</option><option value="WAITING" th:selected="${selectedStatus == 'WAITING'}">工程待ち</option><option value="WORKING" th:selected="${selectedStatus == 'WORKING'}">作業中</option><option value="AVAILABLE" th:selected="${selectedStatus == 'AVAILABLE'}">組立待ち</option><option value="ASSEMBLED" th:selected="${selectedStatus == 'ASSEMBLED'}">組立済み</option><option value="REJECTED" th:selected="${selectedStatus == 'REJECTED'}">製造終了</option></select></div>
<div class="guitar-search-actions"><button class="btn btn-primary" type="submit">検索</button><a class="btn btn-outline" th:href="@{/bodies/view(category=${category})}">クリア</a></div>
</form>
<div class="guitar-search-result" aria-live="polite"><span th:if="${filterApplied}">検索結果</span><span th:unless="${filterApplied}">全件</span><strong th:text="${resultCount}">0</strong><span>件</span></div>
</section>
<div class="guitar-category-list">
<nav class="guitar-category-tabs" aria-label="ボディの分類">
<a id="category-active" class="guitar-category-tab" th:classappend="${category == 'active'} ? 'is-active' : ''" th:attr="aria-current=${category == 'active' ? 'page' : null}" th:href="@{/bodies/view(category='active')}">対応中 <span class="category-count" th:text="${activeCount}">0</span><span>件</span></a>
<a id="category-attention" class="guitar-category-tab" th:classappend="${category == 'attention'} ? 'is-active' : ''" th:attr="aria-current=${category == 'attention' ? 'page' : null}" th:href="@{/bodies/view(category='attention')}">要対応 <span class="category-count" th:text="${attentionCount}">0</span><span>件</span></a>
<a id="category-passed" class="guitar-category-tab" th:classappend="${category == 'passed'} ? 'is-active' : ''" th:attr="aria-current=${category == 'passed' ? 'page' : null}" th:href="@{/bodies/view(category='passed')}">通過済み <span class="category-count" th:text="${passedCount}">0</span><span>件</span></a>
</nav>
<div class="guitar-category-content">
<form th:if="${category != 'passed' and not #lists.isEmpty(bodies)}" id="bulk-start-form" th:action="@{/body-processes/bulk/start}" method="post" class="bulk-process-form">
<section class="bulk-action-panel component-bulk-action-panel"><div class="form-group bulk-process-field"><label class="form-label" for="processId">対象工程</label><select id="processId" name="processId" class="form-select" required><option value="">選択してください</option><option th:each="process : ${bodyProcesses}" th:value="${process.id}" th:text="${process.processName}" th:attr="data-process-name=${process.processName}"></option></select></div><div class="form-group bulk-worker-field"><label class="form-label" for="workerName">作業者</label><input id="workerName" name="workerName" class="form-input" placeholder="作業者名を入力" required></div><div class="bulk-selection-action"><div class="bulk-selection-summary"><span class="bulk-selection-heading">選択中</span><span class="bulk-selection-count"><strong id="selected-count">0</strong>件</span></div><button type="submit" class="btn btn-primary">一括工程開始</button><a th:if="${category == 'active'}" class="btn btn-process-end" th:href="@{/body-processes/bulk/end/view}">一括工程終了</a></div><p class="form-help bulk-process-guidance">このページ内で、対象工程に一致する処理可能な個体だけを選択できます。ページ移動で選択は解除されます。</p></section>
</form>
<div th:if="${#lists.isEmpty(bodies)}" class="empty-state"><p th:if="${filterApplied}">条件に一致するボディはありません。</p><p th:unless="${filterApplied}" th:text="${category == 'active'} ? '対応中のボディはありません。' : (${category == 'attention'} ? '要対応のボディはありません。' : '通過済みのボディはありません。')"></p><a th:if="${filterApplied}" class="btn btn-outline" th:href="@{/bodies/view(category=${category})}">検索条件をクリア</a></div>
<div th:if="${not #lists.isEmpty(bodies)}" class="table-container"><table class="data-table body-management-table bulk-select-table"><colgroup><col th:if="${category != 'passed'}" class="management-column-checkbox"><col class="component-column-serial"><col class="component-column-model"><col class="component-column-process"><col class="component-column-status"><col class="component-column-operation"><col class="component-column-history"></colgroup><thead><tr><th th:if="${category != 'passed'}"><input type="checkbox" id="select-all" aria-label="このページの処理可能な対象を全選択"></th><th>シリアル番号</th><th>モデル名</th><th>現在工程</th><th>状態</th><th>工程操作</th><th>履歴</th></tr></thead><tbody><tr th:each="item : ${bodies}" th:attr="data-process-name=${item.currentProcess}"><td th:if="${category != 'passed'}" class="bulk-checkbox-cell"><input type="checkbox" class="row-checkbox" name="bodyIds" form="bulk-start-form" th:value="${item.id}" th:disabled="${item.status != 'WAITING' and item.status != 'WAITING_INSPECTION' and item.status != 'REWORK'}" th:attr="aria-label=${item.serialNo + 'を選択'},data-base-eligible=${!(item.status != 'WAITING' and item.status != 'WAITING_INSPECTION' and item.status != 'REWORK')}"></td><td><span class="component-serial-number" th:text="${item.serialNo}"></span><div class="list-timestamps"><div>更新 <span class="list-updated-at" th:text="${item.updatedAt == null ? '-' : #temporals.format(item.updatedAt, 'yyyy/MM/dd HH:mm')}">-</span></div><div th:if="${category == 'passed'}">組立可能 <span class="list-event-at" th:text="${item.availableAt == null ? '-' : #temporals.format(item.availableAt, 'yyyy/MM/dd HH:mm')}">-</span></div></div></td><td class="component-model-cell"><div class="component-model-name" th:text="${item.modelName}" th:title="${item.modelName}"></div><div class="component-model-secondary" th:text="${item.color}" th:title="${item.color}"></div></td><td class="component-process-cell"><span class="process-badge" th:text="${item.currentProcess}" th:title="${item.currentProcess}"></span></td><td class="status-cell"><span class="status-badge" th:classappend="${@statusDisplay.getCssClass(item.status)}" th:text="${@statusDisplay.getLabel(item.status)}"></span></td><td class="component-operation-cell"><a th:if="${item.status == 'WORKING'}" class="btn btn-process-end" th:href="@{/body-processes/end/view(bodyId=${item.id})}">工程終了</a><a th:if="${item.status == 'WAITING' or item.status == 'WAITING_INSPECTION' or item.status == 'REWORK'}" class="btn btn-primary" th:href="@{/body-processes/start/view(bodyId=${item.id})}">工程開始</a><span th:if="${item.status == 'AVAILABLE' or item.status == 'ASSEMBLED' or item.status == 'REJECTED' or item.status == 'RETURNED'}">操作不可</span></td><td class="component-history-cell"><a class="btn btn-detail" th:href="@{/bodies/{id}/process-history(id=${item.id})}">工程履歴</a></td></tr></tbody></table></div>
<nav th:if="${totalPages > 1}" class="component-pagination" aria-label="ボディ一覧のページ切替">
<a th:if="${hasPrevious}" id="page-previous" class="btn btn-outline" rel="prev" th:href="@{/bodies/view(category=${category},serial=${serial},modelName=${modelName},currentProcess=${selectedCurrentProcess},status=${selectedStatus},page=${currentPage - 1})}">← 前へ</a>
<button th:unless="${hasPrevious}" id="page-previous" class="btn btn-outline" type="button" disabled>← 前へ</button>
<span id="page-position" aria-live="polite" th:text="${(currentPage + 1) + ' / ' + totalPages}">1 / 2</span>
<a th:if="${hasNext}" id="page-next" class="btn btn-outline" rel="next" th:href="@{/bodies/view(category=${category},serial=${serial},modelName=${modelName},currentProcess=${selectedCurrentProcess},status=${selectedStatus},page=${currentPage + 1})}">次へ →</a>
<button th:unless="${hasNext}" id="page-next" class="btn btn-outline" type="button" disabled>次へ →</button>
</nav>
</div></div>
</main>
<script th:inline="none">
(() => {
 const processSelect=document.getElementById('processId');
 const workerName=document.getElementById('workerName');
 const submitButton=document.querySelector('#bulk-start-form button[type="submit"]');
 const selectAll=document.getElementById('select-all');
 const boxes=Array.from(document.querySelectorAll('.row-checkbox'));
 const selectedCount=document.getElementById('selected-count');
 if(!processSelect||!workerName||!submitButton||!selectAll||!selectedCount)return;
 const options=Array.from(processSelect.options).filter(option=>option.value!=='');
 const hasEligibleTarget=processName=>boxes.some(box=>box.dataset.baseEligible==='true'&&box.closest('tr').dataset.processName===processName);
 options.forEach(option=>{const name=option.dataset.processName||option.textContent.trim();option.hidden=!hasEligibleTarget(name);option.disabled=option.hidden;});
 const availableOptions=options.filter(option=>!option.hidden); const placeholder=processSelect.options[0];
 if(availableOptions.length===0){placeholder.textContent='一括開始可能な工程はありません';processSelect.disabled=true;workerName.disabled=true;submitButton.disabled=true;}
 const update=()=>{const enabled=boxes.filter(box=>!box.disabled);const checked=enabled.filter(box=>box.checked);selectedCount.textContent=checked.length;selectAll.disabled=enabled.length===0;selectAll.checked=enabled.length>0&&checked.length===enabled.length;selectAll.indeterminate=checked.length>0&&checked.length<enabled.length;};
 const applyFilter=()=>{const option=processSelect.selectedOptions[0];const processName=option?.dataset.processName||option?.textContent.trim()||'';const selected=processSelect.value!=='';boxes.forEach(box=>{const row=box.closest('tr');const eligible=box.dataset.baseEligible==='true';const matches=selected&&row.dataset.processName===processName;box.checked=false;box.disabled=!(eligible&&matches);row.classList.toggle('is-disabled',!(eligible&&matches));});update();};
 window.addEventListener('pageshow', applyFilter);
    processSelect.addEventListener('change',applyFilter); selectAll.addEventListener('change',()=>{boxes.filter(box=>!box.disabled).forEach(box=>box.checked=selectAll.checked);update();}); boxes.forEach(box=>box.addEventListener('change',update)); applyFilter();
})();
</script>
</body>
</html>
