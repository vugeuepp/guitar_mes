<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボディ工程一括終了</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header('ボディ工程一括終了')}"></div>
<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">
            対象工程を選択し、同じ工程のボディをまとめて終了します。
        </p>
        <div class="page-toolbar-actions">
            <a class="btn btn-outline" th:href="@{/bodies/view}">一覧へ戻る</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="success-message" role="status"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="error-message" role="alert"
         th:text="${errorMessage}"></div>

    <form th:if="${not #lists.isEmpty(histories)}"
          th:action="@{/body-processes/bulk/end}"
          method="post"
          id="bulk-end-form">
        <section class="bulk-action-panel">
            <div class="form-group">
                <label class="form-label" for="targetProcessId">対象工程</label>
                <select id="targetProcessId" class="form-select" required>
                    <option value="">選択してください</option>
                    <option th:each="process : ${processes}"
                            th:if="${#lists.contains(histories.![processId], process.id)}"
                            th:value="${process.id}"
                            th:text="${process.processName}"
                            th:attr="data-process-name=${process.processName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="result">共通結果</label>
                <select id="result" name="result" class="form-select" required disabled>
                    <option value="">先に対象工程を選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="note">共通備考</label>
                <textarea id="note" name="note" class="form-input" rows="3"></textarea>
            </div>

            <div class="bulk-selection-count">
                選択中: <strong id="selected-count">0</strong>件
            </div>
            <button type="submit" class="btn btn-process-end">一括工程終了</button>
        </section>

        <div class="table-container">
            <table class="data-table bulk-select-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="select-all" aria-label="対象工程を全件選択" disabled></th>
                    <th>履歴ID</th>
                    <th>ボディID</th>
                    <th>工程名</th>
                    <th>作業者</th>
                    <th>開始時刻</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="history : ${histories}"
                    th:attr="data-history-id=${history.id},data-process-id=${history.processId}">
                    <td>
                        <input type="checkbox"
                               class="row-checkbox"
                               name="historyIds"
                               th:value="${history.id}"
                               disabled>
                    </td>
                    <td th:text="${history.id}"></td>
                    <td th:text="${history.bodyId}"></td>
                    <td>
                        <span th:each="process : ${processes}"
                              th:if="${process.id == history.processId}"
                              th:text="${process.processName}"></span>
                    </td>
                    <td th:text="${history.workerName}"></td>
                    <td th:text="${history.startTime}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(histories)}" class="empty-state">
        現在実施中の工程はありません。
    </div>
</main>

<script th:inline="none">
(() => {
    const processSelect = document.getElementById('targetProcessId');
    const resultSelect = document.getElementById('result');
    const selectAll = document.getElementById('select-all');
    const boxes = Array.from(document.querySelectorAll('.row-checkbox'));
    const selectedCount = document.getElementById('selected-count');

    if (!processSelect || !resultSelect || !selectAll || !selectedCount) {
        return;
    }

    const resultOptions = processName => {
        if (processName === '塗装後検品') {
            return [
                { value: 'PASSED', label: '合格' },
                { value: 'REWORK', label: '手直し' },
                { value: 'REJECTED', label: '不合格' }
            ];
        }
        if (processName === 'バフがけ' || processName === 'パーツ付け') {
            return [{ value: 'COMPLETED', label: '完了' }];
        }
        return [];
    };

    const rebuildResultOptions = processName => {
        const options = resultOptions(processName);
        resultSelect.replaceChildren();

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = options.length > 0
            ? '選択してください'
            : '対象工程を確認してください';
        resultSelect.appendChild(placeholder);

        options.forEach(item => {
            const option = document.createElement('option');
            option.value = item.value;
            option.textContent = item.label;
            resultSelect.appendChild(option);
        });

        resultSelect.disabled = options.length === 0;
    };

    const updateSelectionState = () => {
        const enabledBoxes = boxes.filter(box => !box.disabled);
        const checkedBoxes = enabledBoxes.filter(box => box.checked);

        selectedCount.textContent = checkedBoxes.length;
        selectAll.disabled = enabledBoxes.length === 0;
        selectAll.checked = enabledBoxes.length > 0
            && checkedBoxes.length === enabledBoxes.length;
        selectAll.indeterminate = checkedBoxes.length > 0
            && checkedBoxes.length < enabledBoxes.length;
    };

    const applyProcessFilter = () => {
        const processId = processSelect.value;
        const selectedOption = processSelect.selectedOptions[0];
        const processName = selectedOption?.dataset.processName || '';

        boxes.forEach(box => {
            const row = box.closest('tr');
            const matches = processId !== ''
                && row.dataset.processId === processId;
            box.checked = false;
            box.disabled = !matches;
            row.classList.toggle('is-disabled', !matches);
        });

        selectAll.checked = false;
        selectAll.indeterminate = false;
        rebuildResultOptions(processName);
        updateSelectionState();
    };

    processSelect.addEventListener('change', applyProcessFilter);
    selectAll.addEventListener('change', () => {
        boxes.filter(box => !box.disabled)
            .forEach(box => box.checked = selectAll.checked);
        updateSelectionState();
    });
    boxes.forEach(box => box.addEventListener('change', updateSelectionState));

    applyProcessFilter();
})();
</script>
</body>
</html>
