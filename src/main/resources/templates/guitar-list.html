<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        ギター管理一覧
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace=
     "~{fragments/header :: header('ギター管理一覧')}">
</div>

<main class="page-container">
    <div class="page-toolbar">
        <p class="page-toolbar-description">
            複数のギターを選択し、同じ工程を一括開始できます。
        </p>
        <div class="page-toolbar-actions">
            <a class="btn btn-process-end" th:href="@{/processes/end/view}">
                一括工程終了
            </a>
            <a class="btn btn-primary" th:href="@{/production-orders/view}">
                生産計画一覧を開く
            </a>
        </div>
    </div>
    <div th:if="${successMessage}" class="success-message" role="status"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="error-message" role="alert"
         th:text="${errorMessage}"></div>
    <div th:if="${#lists.isEmpty(guitars)}" class="empty-state">
        <p>生成済みのギター個体はありません。</p>
    </div>
    <form th:if="${not #lists.isEmpty(guitars)}"
          th:action="@{/processes/bulk/start}" method="post"
          class="bulk-process-form" id="bulk-start-form">
        <section class="bulk-action-panel">
            <p class="form-help bulk-process-guidance">
                先に対象工程を選択してください。選択した工程と一致するギターだけを一括選択できます。
            </p>
            <div class="form-group">
                <label class="form-label" for="processId">対象工程</label>
                <select id="processId" name="processId" class="form-select" required>
                    <option value="">選択してください</option>
                    <option th:each="process : ${processes}"
                            th:value="${process.id}"
                            th:text="${process.processName}"
                            th:attr="data-process-name=${process.processName}"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="workerName">作業者</label>
                <input id="workerName" name="workerName" class="form-input" required>
            </div>
            <div class="bulk-selection-count">選択中: <strong id="selected-count">0</strong>件</div>
            <button type="submit" class="btn btn-primary">一括工程開始</button>
        </section>
        <div class="table-container">
            <table class="data-table guitar-management-table bulk-select-table">
                <thead><tr>
                    <th><input type="checkbox" id="select-all" aria-label="全件選択"></th>
                    <th>ID</th><th>シリアル番号</th><th>製品</th><th>現在工程</th>
                    <th>進捗率</th><th>状態</th><th>操作</th><th>詳細</th>
                </tr></thead>
                <tbody>
                <tr th:each="guitar : ${guitars}"
                    th:attr="data-process-name=${guitar.currentProcess}"
                    th:classappend="${guitar.currentProcess == '完成'} ? 'completed' : ''">
                    <td class="bulk-checkbox-cell">
                        <input type="checkbox" name="guitarIds" class="row-checkbox"
                               th:value="${guitar.id}"
                               th:disabled="${guitar.hasRunningProcess or !guitar.hasNextProcess}"
                               th:attr="aria-label=${guitar.serialNo + 'を選択'},data-base-eligible=${!guitar.hasRunningProcess and guitar.hasNextProcess}">
                    </td>
                    <td th:text="${guitar.id}"></td>
                    <td><span class="guitar-serial-number" th:text="${guitar.serialNo}"></span></td>
                    <td class="guitar-management-product-cell" th:text="${guitar.productName}"></td>
                    <td th:text="${guitar.currentProcess}"></td>
                    <td th:text="${guitar.progressRate + '%'}"></td>
                    <td class="status-cell">
                        <span th:if="${guitar.hasRunningProcess}" class="status-badge status-working">作業中</span>
                        <span th:if="${!guitar.hasRunningProcess and guitar.currentProcess != '完成'}" class="status-badge status-waiting">工程待ち</span>
                        <span th:if="${!guitar.hasRunningProcess and guitar.currentProcess == '完成'}" class="status-badge status-available">完成</span>
                    </td>
                    <td class="guitar-operation-cell">
                        <a th:if="${guitar.hasRunningProcess}" class="btn btn-process-end"
                           th:href="@{/processes/end/view(guitarId=${guitar.id})}">工程終了</a>
                        <a th:if="${!guitar.hasRunningProcess and guitar.hasNextProcess}" class="btn btn-primary"
                           th:href="@{/processes/start/view(guitarId=${guitar.id})}">工程開始</a>
                        <span th:if="${!guitar.hasRunningProcess and !guitar.hasNextProcess}" class="list-no-action">操作なし</span>
                    </td>
                    <td class="table-action-cell"><a class="btn btn-detail"
                        th:href="@{/guitars/{id}/view(id=${guitar.id})}">詳細</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>
</main>

<script th:inline="none">
(() => {
    const processSelect = document.getElementById('processId');
    const workerName = document.getElementById('workerName');
    const submitButton = document.querySelector('#bulk-start-form button[type="submit"]');
    const selectAll = document.getElementById('select-all');
    const boxes = Array.from(document.querySelectorAll('.row-checkbox'));
    const selectedCount = document.getElementById('selected-count');

    if (!processSelect || !workerName || !submitButton
            || !selectAll || !selectedCount) return;

    const processOptions = Array.from(processSelect.options)
        .filter(option => option.value !== '');
    const hasEligibleTarget = processName => boxes.some(box => {
        const row = box.closest('tr');
        return box.dataset.baseEligible === 'true'
            && row.dataset.processName === processName;
    });

    processOptions.forEach(option => {
        const name = option.dataset.processName || option.textContent.trim();
        option.hidden = !hasEligibleTarget(name);
        option.disabled = option.hidden;
    });

    const availableOptions = processOptions.filter(option => !option.hidden);
    const placeholder = processSelect.options[0];
    if (availableOptions.length === 0) {
        placeholder.textContent = '一括開始可能な工程はありません';
        processSelect.disabled = true;
        workerName.disabled = true;
        submitButton.disabled = true;
    }

    const update = () => {
        const enabled = boxes.filter(box => !box.disabled);
        const checked = enabled.filter(box => box.checked);
        selectedCount.textContent = checked.length;
        selectAll.disabled = enabled.length === 0;
        selectAll.checked = enabled.length > 0 && checked.length === enabled.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < enabled.length;
    };

    const applyFilter = () => {
        const option = processSelect.selectedOptions[0];
        const processName = option?.dataset.processName || option?.textContent.trim() || '';
        const selected = processSelect.value !== '';
        boxes.forEach(box => {
            const row = box.closest('tr');
            const eligible = box.dataset.baseEligible === 'true';
            const matches = selected && row.dataset.processName === processName;
            box.checked = false;
            box.disabled = !(eligible && matches);
            row.classList.toggle('is-disabled', !(eligible && matches));
        });
        selectAll.checked = false;
        selectAll.indeterminate = false;
        update();
    };

    processSelect.addEventListener('change', applyFilter);
    selectAll.addEventListener('change', () => {
        boxes.filter(box => !box.disabled)
            .forEach(box => box.checked = selectAll.checked);
        update();
    });
    boxes.forEach(box => box.addEventListener('change', update));
    applyFilter();
})();
</script>
</body>

</html>
