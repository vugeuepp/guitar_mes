<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="header(title)">

    <header class="app-header">

		<div class="app-header-main">

		    <a class="app-brand"
		       th:href="@{/}">

		        <span class="app-brand-mark">
		            GM
		        </span>

		        <span class="app-brand-text">
		            Guitar MES
		        </span>

		    </a>

		    <span class="app-subtitle">
		        Production Control System
		    </span>

		    <!-- モバイル用メニューボタン -->
		    <button type="button"
		            id="menuToggle"
		            class="menu-toggle"
		            aria-label="メニュー">

		        ☰

		    </button>

		</div>

		<!-- 共通ナビゲーション -->
		<div th:replace=
		     "~{fragments/menu :: menu}">
		</div>

    </header>

    <div class="page-heading">

        <h1 th:text="${title}">
        </h1>

    </div>
	<script>

	document.addEventListener(
	    "DOMContentLoaded",
	    function() {

	        const menuToggle =
	            document.getElementById(
	                "menuToggle"
	            );

	        const topNav =
	            document.getElementById(
	                "topNav"
	            );

	        if (!menuToggle || !topNav) {
	            return;
	        }

	        menuToggle.addEventListener(
	            "click",
	            function() {

	                topNav.classList.toggle(
	                    "mobile-open"
	                );

	            }
	        );
	    });

	</script>

</th:block>

</html>
