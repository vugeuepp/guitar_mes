<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        製品登録
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('製品登録')}">
</div>

<main class="page-container">

    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ギター製品仕様を登録します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/products/view}">
                製品一覧へ戻る
            </a>
        </div>
    </div>

    <form th:action="@{/products/create}"
          method="post"
          class="form-container">

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Product Master
                    </p>

                    <h2 class="form-section-title">
                        基本情報
                    </h2>
                </div>

                <p class="form-section-description">
                    製品の基本仕様を入力してください。
                </p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label class="form-label"
                           for="modelNo">
                        モデル番号
                    </label>

                    <input type="text"
                           id="modelNo"
                           name="modelNo"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="productName">
                        製品名
                    </label>

                    <input type="text"
                           id="productName"
                           name="productName"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="color">
                        カラー
                    </label>

                    <input type="text"
                           id="color"
                           name="color"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="pickupLayout">
                        PU構成
                    </label>

                    <input type="text"
                           id="pickupLayout"
                           name="pickupLayout"
                           class="form-input">
                </div>

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Material Specification
                    </p>

                    <h2 class="form-section-title">
                        材料構成
                    </h2>
                </div>

                <p class="form-section-description">
                    ボディ・ネック・指板の仕様を入力してください。
                </p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label class="form-label"
                           for="bodyMaterial">
                        ボディ材
                    </label>

                    <input type="text"
                           id="bodyMaterial"
                           name="bodyMaterial"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="neckMaterial">
                        ネック材
                    </label>

                    <input type="text"
                           id="neckMaterial"
                           name="neckMaterial"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="fingerboardMaterial">
                        指板材
                    </label>

                    <input type="text"
                           id="fingerboardMaterial"
                           name="fingerboardMaterial"
                           class="form-input">
                </div>

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Neck Specification
                    </p>

                    <h2 class="form-section-title">
                        ネック仕様
                    </h2>
                </div>

                <p class="form-section-description">
                    フレット数とスケールを入力してください。
                </p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label class="form-label"
                           for="fretCount">
                        フレット数
                    </label>

                    <input type="number"
                           id="fretCount"
                           name="fretCount"
                           class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label"
                           for="scale">
                        スケール
                    </label>

                    <input type="text"
                           id="scale"
                           name="scale"
                           class="form-input">
                </div>

            </div>

        </section>

        <div class="form-actions">

            <a class="btn btn-outline"
               th:href="@{/products/view}">
                キャンセル
            </a>

            <button type="submit"
                    class="btn btn-primary">
                製品を登録
            </button>

        </div>

    </form>

</main>

</body>
</html>
