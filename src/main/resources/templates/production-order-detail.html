<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">

<title>
生産計画詳細
</title>

<link rel="stylesheet"
      th:href="@{/css/style.css}">

</head>

<body>

<div th:replace=
 "~{fragments/header :: header('生産計画詳細')}">
</div>

<p>

指示番号：

<span th:text=
      "${order.orderNo}">
</span>

</p>

<p>
    モデル番号：
    <span th:text="${order.product.modelNo}">
    </span>
</p>

<p>
    製品名：
    <span th:text="${order.product.productName}">
    </span>
</p>

<p>
    カラー：
    <span th:text="${order.product.color}">
    </span>
</p>

<p>
    指板材：

    <span th:text=
          "${order.product.fingerboardMaterial}">
    </span>
</p>

<p>

計画数：

<span th:text=
      "${order.plannedQuantity}">
</span>

</p>

<p>

着手数：

<span th:text=
      "${order.startedQuantity}">
</span>

</p>

<p>

完成数：

<span th:text=
      "${order.completedQuantity}">
</span>

</p>

<hr>

<section>

    <h2>
        生成済みギター
    </h2>

    <p th:if="${#lists.isEmpty(guitars)}">
        まだギター個体は生成されていません。
    </p>

    <table th:if="${not #lists.isEmpty(guitars)}"
           border="1">

        <tr>
            <th>シリアル番号</th>
            <th>現在工程</th>
            <th>製品</th>
            <th>詳細</th>
        </tr>

        <tr th:each="guitar : ${guitars}">

            <td th:text="${guitar.serialNo}">
            </td>

            <td th:text="${guitar.currentProcess}">
            </td>

            <td th:text="${guitar.product.modelNo
                    + ' / '
                    + guitar.product.productName
                    + ' / '
                    + guitar.product.color}">
            </td>

            <td>
                <form th:action=
                      "@{/guitars/{id}/view(id=${guitar.id})}"
                      method="get">

                    <button type="submit"
                            class="history-button">
                        詳細
                    </button>

                </form>
            </td>

        </tr>

    </table>

</section>

<p>
    状態：

    <span class="status-badge"
          th:classappend="${@productionOrderDisplay.getCssClass(order.status)}"
          th:text="${@productionOrderDisplay.getLabel(order.status)}">
    </span>
</p>

<p>

開始予定日：

<span th:text=
      "${order.plannedStartDate}">
</span>

</p>

<p>

納期：

<span th:text=
      "${order.dueDate}">
</span>

</p>

<br>

<hr>

<section>

    <h2>
        製造開始
    </h2>

    <!-- 計画数に達していない場合 -->
    <form th:if="${order.startedQuantity
                    < order.plannedQuantity
                  and order.status != 'COMPLETED'
                  and order.status != 'CANCELLED'}"
          th:action="@{/assemblies/new}"
          method="get">

        <input type="hidden"
               name="productionOrderId"
               th:value="${order.id}">

        <button type="submit"
                class="process-button process-start-button">

            ネック取付

        </button>

    </form>

    <!-- 計画数に到達 -->
    <p th:if="${order.startedQuantity
               >= order.plannedQuantity}">

        この生産計画は計画数に達しています。

    </p>

    <!-- 中止済み -->
    <p th:if="${order.status == 'CANCELLED'}">

        この生産計画は中止されています。

    </p>

    <!-- 完了済み -->
    <p th:if="${order.status == 'COMPLETED'}">

        この生産計画は完了しています。

    </p>

</section>
<a th:href=
   "@{/production-orders/view}">
   一覧へ戻る
</a>

</body>
</html>
