<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ネック工程履歴
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ネック工程履歴')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ネック工程の実施履歴を確認できます。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/necks/view}">
                ネック一覧へ戻る
            </a>
        </div>

    </div>

    <section class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Neck Information
                </p>

                <h2 class="detail-section-title"
                    th:text="${neck.serialNo}">
                </h2>
            </div>

        </div>

        <div class="detail-grid">

            <div class="detail-item">

                <div class="detail-label">
                    シリアル番号
                </div>

                <div class="detail-value"
                     th:text="${neck.serialNo}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    モデル
                </div>

                <div class="detail-value"
                     th:text="${neck.modelName}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    現在工程
                </div>

                <div class="detail-value"
                     th:text="${neck.currentProcess}">
                </div>

            </div>

            <div class="detail-item">

                <div class="detail-label">
                    ステータス
                </div>

                <div class="detail-value">

                    <span class="status-badge"
                          th:classappend="${@statusDisplay.getCssClass(neck.status)}"
                          th:text="${@statusDisplay.getLabel(neck.status)}">
                    </span>

                </div>

            </div>

        </div>

    </section>

    <div th:if="${#lists.isEmpty(histories)}"
         class="empty-state">

        <p>
            工程履歴はありません。
        </p>

    </div>

    <section th:if="${not #lists.isEmpty(histories)}"
             class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Process History
                </p>

                <h2 class="detail-section-title">
                    工程履歴
                </h2>
            </div>

            <div class="detail-section-count">
                <span th:text="${#lists.size(histories)}">
                </span>
                <span>
                    件
                </span>
            </div>

        </div>

        <div class="table-container">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>
                            履歴ID
                        </th>
                        <th>
                            工程
                        </th>
                        <th>
                            結果
                        </th>
                        <th>
                            作業者
                        </th>
                        <th>
                            開始日時
                        </th>
                        <th>
                            終了日時
                        </th>
                        <th>
                            作業時間
                        </th>
                        <th>
                            備考
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="history : ${histories}">

                        <td th:text="${history.historyId}">
                        </td>

                        <td th:text="${history.processName}">
                        </td>

                        <td>

                            <span th:switch="${history.result}">

                                <span th:case="'COMPLETED'"
                                      class="status-badge status-assembled">
                                    完了
                                </span>

                                <span th:case="'NG'"
                                      class="status-badge status-rejected">
                                    NG
                                </span>

                                <span th:case="null"
                                      class="status-badge status-working">
                                    実施中
                                </span>

                                <span th:case="*"
                                      th:text="${history.result}">
                                </span>

                            </span>

                        </td>

                        <td th:text="${history.workerName}">
                        </td>

                        <td th:text="${history.startTimeText}">
                        </td>

                        <td th:text="${#strings.isEmpty(history.endTimeText)
                                ? '-'
                                : history.endTimeText}">
                        </td>

                        <td th:text="${history.workMinutesText}">
                        </td>

                        <td th:text="${#strings.isEmpty(history.note)
                                ? '-'
                                : history.note}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <div class="detail-footer-actions">

        <a class="btn btn-outline"
           th:href="@{/necks/view}">
            ネック一覧へ戻る
        </a>

    </div>

</main>

</body>
</html>
