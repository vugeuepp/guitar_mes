<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ネック取付実績一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('ネック取付実績一覧')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ネック取付実績を確認できます。
            新規登録は生産計画詳細画面から実施してください。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-primary"
               th:href="@{/production-orders/view}">
                生産計画一覧
            </a>
        </div>

    </div>

    <div th:if="${#lists.isEmpty(assemblies)}"
         class="empty-state">

        <p>ネック取付実績はありません。</p>

    </div>

    <div th:unless="${#lists.isEmpty(assemblies)}"
         class="table-container">

        <table class="data-table assembly-management-table">

            <colgroup>
                <col class="assembly-column-guitar">
                <col class="assembly-column-neck">
                <col class="assembly-column-body">
                <col class="assembly-column-worker">
                <col class="assembly-column-date">
                <col class="assembly-column-detail">
            </colgroup>

            <thead>
            <tr>
                <th>ギター</th>
                <th>ネック</th>
                <th>ボディ</th>
                <th>作業者</th>
                <th>組立日時</th>
                <th>詳細</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="assembly : ${assemblies}">

                <td class="assembly-guitar-cell">
                    <div class="assembly-serial"
                         th:text="${assembly.guitarSerial}"></div>
                    <div class="assembly-product-name"
                         th:text="${assembly.productName}"
                         th:title="${assembly.productName}"></div>
                    <div class="assembly-product-color"
                         th:text="${assembly.productColor}"
                         th:title="${assembly.productColor}"></div>
                </td>

                <td>
                    <span class="assembly-component-serial"
                          th:text="${assembly.neckSerial}"></span>
                </td>

                <td>
                    <span class="assembly-component-serial"
                          th:text="${assembly.bodySerial}"></span>
                </td>

                <td class="assembly-worker-cell"
                    th:text="${assembly.workerName}"></td>

                <td class="assembly-date-cell"
                    th:text="${assembly.assemblyDateText}"></td>

                <td class="list-action-cell assembly-detail-cell">

                    <a class="btn btn-detail"
                       th:href="@{/assemblies/{id}/view(id=${assembly.assemblyId})}">
                        詳細
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
