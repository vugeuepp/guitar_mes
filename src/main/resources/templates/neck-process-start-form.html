<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ネック工程開始
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ネック工程開始')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ネック工程の開始登録を行います。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/necks/view}">
                ネック一覧へ戻る
            </a>
        </div>

    </div>

    <form th:action="@{/neck-processes/start}"
          method="post"
          class="form-container">

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Target Neck
                    </p>

                    <h2 class="form-section-title">
                        対象ネック
                    </h2>
                </div>

                <p class="form-section-description">
                    工程開始対象のネックを確認します。
                </p>

            </div>

            <div class="selected-product-info">

                <div class="selected-product-label">
                    対象ネック
                </div>

                <strong class="selected-product-value"
                        th:text="${selectedNeck.serialNo
                            + ' / '
                            + selectedNeck.modelName}">
                </strong>

                <input type="hidden"
                       name="neckId"
                       th:value="${selectedNeck.id}">

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Process
                    </p>

                    <h2 class="form-section-title">
                        開始工程
                    </h2>
                </div>

                <p class="form-section-description">
                    開始対象の工程を確認します。
                </p>

            </div>

            <div class="selected-product-info">

                <div class="selected-product-label">
                    工程
                </div>

                <strong class="selected-product-value"
                        th:text="${currentProcess.processName}">
                </strong>

                <input type="hidden"
                       name="processId"
                       th:value="${currentProcess.id}">

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Worker Information
                    </p>

                    <h2 class="form-section-title">
                        作業者情報
                    </h2>
                </div>

                <p class="form-section-description">
                    作業者名を入力してください。
                </p>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label for="workerName"
                           class="form-label">
                        作業者
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <input type="text"
                           id="workerName"
                           name="workerName"
                           class="form-input"
                           required>

                </div>

            </div>

        </section>

        <div class="form-actions">

            <a class="btn btn-outline"
               th:href="@{/necks/view}">
                キャンセル
            </a>

            <button type="submit"
                    class="btn btn-primary">
                工程開始
            </button>

        </div>

    </form>

</main>

</body>
</html>
