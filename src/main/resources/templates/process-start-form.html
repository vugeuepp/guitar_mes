<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ギター工程開始
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ギター工程開始')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ギター工程の開始登録を行います。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/guitars/view}">
                ギター一覧へ戻る
            </a>
        </div>

    </div>

    <form th:action="@{/processes/start}"
          method="post"
          class="form-container">

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Target Guitar
                    </p>

                    <h2 class="form-section-title">
                        対象ギター
                    </h2>
                </div>

                <p class="form-section-description">
                    工程開始対象のギターを確認または選択します。
                </p>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label class="form-label">
                        ギター
                    </label>

                    <div th:if="${selectedGuitar != null}"
                         class="selected-product-info">

                        <strong class="selected-product-value"
                                th:text="${selectedGuitar.serialNo
                                    + ' ('
                                    + selectedGuitar.product.productName
                                    + ' / '
                                    + selectedGuitar.product.color
                                    + ')'}">
                        </strong>

                        <input type="hidden"
                               name="guitarId"
                               th:value="${selectedGuitar.id}">

                    </div>

                    <div th:if="${selectedGuitar == null}">

                        <select name="guitarId"
                                class="form-select"
                                required>

                            <option value="">
                                選択してください
                            </option>

                            <option th:each="guitar : ${guitars}"
                                    th:value="${guitar.id}"
                                    th:text="${guitar.serialNo
                                        + ' ('
                                        + guitar.product.productName
                                        + ' / '
                                        + guitar.product.color
                                        + ')'}">
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Process
                    </p>

                    <h2 class="form-section-title">
                        対象工程
                    </h2>
                </div>

                <p class="form-section-description">
                    開始する工程を確認または選択します。
                </p>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label class="form-label">
                        工程
                    </label>

                    <div th:if="${nextProcess != null}"
                         class="selected-product-info">

                        <strong class="selected-product-value"
                                th:text="${nextProcess.processName}">
                        </strong>

                        <input type="hidden"
                               name="processId"
                               th:value="${nextProcess.id}">

                    </div>

                    <div th:if="${nextProcess == null}">

                        <select name="processId"
                                class="form-select"
                                required>

                            <option value="">
                                選択してください
                            </option>

                            <option th:each="process : ${processes}"
                                    th:value="${process.id}"
                                    th:text="${process.processName}">
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">

                <div>
                    <p class="form-section-caption">
                        Worker Information
                    </p>

                    <h2 class="form-section-title">
                        作業者情報
                    </h2>
                </div>

                <p class="form-section-description">
                    工程を開始する作業者を入力してください。
                </p>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label for="workerName"
                           class="form-label">
                        作業者
                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <input type="text"
                           id="workerName"
                           name="workerName"
                           class="form-input"
                           required>

                </div>

            </div>

        </section>

        <div class="form-actions">

            <a class="btn btn-outline"
               th:href="@{/guitars/view}">
                キャンセル
            </a>

            <button type="submit"
                    class="btn btn-primary">
                工程開始
            </button>

        </div>

    </form>

</main>

</body>
</html>
