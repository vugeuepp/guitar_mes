<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        生産計画一覧
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace=
     "~{fragments/header :: header('生産計画一覧')}">
</div>

<main class="page-container">

    <!-- 説明・主要操作 -->
    <div class="page-toolbar">

        <p class="page-toolbar-description" th:text="${category == 'active'}
            ? '現在進行中または着手予定の生産計画を確認できます。'
            : (${category == 'completed'} ? '完了した生産計画と実績を確認できます。' : '取消された生産計画を確認できます。')"></p>

        <div class="page-toolbar-actions">

            <a class="btn btn-primary"
               th:href="@{/production-orders/new}">

                生産計画を登録

            </a>

        </div>

    </div>

    <section class="guitar-search-panel" aria-label="生産計画検索・フィルタ">
        <form class="guitar-search-form" method="get" th:action="@{/production-orders/view}">
            <input type="hidden" name="category" th:value="${category}">
            <div class="form-group"><label class="form-label" for="orderNo">生産指示番号</label>
                <input class="form-input" id="orderNo" name="orderNo" type="search" th:value="${orderNo}" placeholder="番号の一部を入力"></div>
            <div class="form-group"><label class="form-label" for="product">製品名・モデル番号</label>
                <input class="form-input" id="product" name="product" type="search" th:value="${product}" placeholder="製品名またはモデル番号"></div>
            <div class="form-group"><label class="form-label" for="planMonth">計画月</label>
                <input class="form-input" id="planMonth" name="planMonth" type="search" th:value="${planMonth}" placeholder="yyyy-MM"></div>
            <div class="form-group"><label class="form-label" for="dueFrom">納期（開始）</label>
                <input class="form-input" id="dueFrom" name="dueFrom" type="search" th:value="${dueFrom}" placeholder="yyyy-MM-dd"></div>
            <div class="form-group"><label class="form-label" for="dueTo">納期（終了）</label>
                <input class="form-input" id="dueTo" name="dueTo" type="search" th:value="${dueTo}" placeholder="yyyy-MM-dd"></div>
            <div class="form-group"><label class="form-label" for="status">状態</label>
                <select class="form-select" id="status" name="status"><option value="">すべて</option>
                    <option th:if="${categoryStatuses.contains('PLANNED')}" value="PLANNED" th:selected="${selectedStatus == 'PLANNED'}">計画中</option>
                    <option th:if="${categoryStatuses.contains('IN_PROGRESS')}" value="IN_PROGRESS" th:selected="${selectedStatus == 'IN_PROGRESS'}">製造中</option>
                    <option th:if="${categoryStatuses.contains('COMPLETED')}" value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">完了</option>
                    <option th:if="${categoryStatuses.contains('CANCELLED')}" value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">取消</option>
                    <option th:if="${!#strings.isEmpty(selectedStatus) and !categoryStatuses.contains(selectedStatus)}"
                            th:value="${selectedStatus}" selected
                            th:text="${@productionOrderDisplay.getLabel(selectedStatus)}"></option>
                </select></div>
            <div class="guitar-search-actions"><button class="btn btn-primary" type="submit">検索</button>
                <a class="btn btn-outline" th:href="@{/production-orders/view(category=${category})}">クリア</a></div>
        </form>
        <div th:unless="${searchError}" class="guitar-search-result" aria-live="polite">
            <span th:if="${filterApplied}">検索結果</span><span th:unless="${filterApplied}">全件</span>
            <strong th:text="${resultCount}">0</strong><span>件</span>
        </div>
    </section>
    <div class="guitar-category-list">
        <nav class="guitar-category-tabs" aria-label="生産計画の分類">
            <a id="category-active" class="guitar-category-tab"
               th:classappend="${category == 'active'} ? 'is-active' : ''"
               th:attr="aria-current=${category == 'active' ? 'page' : null}"
               th:href="@{/production-orders/view(category='active')}">進行中 <span class="category-count" th:text="${activeCount}">0</span><span>件</span></a>
            <a id="category-completed" class="guitar-category-tab"
               th:classappend="${category == 'completed'} ? 'is-active' : ''"
               th:attr="aria-current=${category == 'completed' ? 'page' : null}"
               th:href="@{/production-orders/view(category='completed')}">完了 <span class="category-count" th:text="${completedCount}">0</span><span>件</span></a>
            <a id="category-cancelled" class="guitar-category-tab"
               th:classappend="${category == 'cancelled'} ? 'is-active' : ''"
               th:attr="aria-current=${category == 'cancelled' ? 'page' : null}"
               th:href="@{/production-orders/view(category='cancelled')}">取消 <span class="category-count" th:text="${cancelledCount}">0</span><span>件</span></a>
        </nav>
        <div class="guitar-category-content">
    <div th:if="${searchError}" class="error-message" role="alert" th:text="${searchError}"></div>
    <div th:if="${#lists.isEmpty(orders) and searchError == null}" class="empty-state">
        <p th:if="${filterApplied}">条件に一致する生産計画はありません。</p>
        <p th:unless="${filterApplied}" th:text="${category == 'active'} ? '進行中の生産計画はありません。'
            : (${category == 'completed'} ? '完了した生産計画はありません。' : '取消された生産計画はありません。')"></p>
        <a th:if="${filterApplied}" class="btn btn-outline" th:href="@{/production-orders/view(category=${category})}">検索条件をクリア</a>
        <a th:unless="${filterApplied}" class="btn btn-primary" th:href="@{/production-orders/new}">生産計画を登録</a>
    </div>

    <!-- 生産計画一覧 -->
    <div th:if="${not #lists.isEmpty(orders)}"
         class="table-container">

        <table class="data-table production-order-table">

            <colgroup>

                <col class="production-order-column-number">

                <col class="production-order-column-product">

                <col class="production-order-column-fingerboard">

                <col class="production-order-column-quantity">

                <col class="production-order-column-quantity">

                <col class="production-order-column-quantity">

                <col class="production-order-column-status">

                <col class="production-order-column-action">

            </colgroup>

            <thead>

                <tr>

                    <th>
                        生産指示番号
                    </th>

                    <th>
                        製品
                    </th>

                    <th>
                        指板材
                    </th>

                    <th>
                        計画数
                    </th>

                    <th>
                        着手数
                    </th>

                    <th>
                        完成数
                    </th>

                    <th>
                        状態
                    </th>

                    <th>
                        詳細
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="order : ${orders}"
                    th:classappend=
                    "${order.status == 'COMPLETED'}
                    ? 'completed'
                    : ''">

                    <td>

                        <span class="order-number"
                              th:text="${order.orderNo}">
                        </span><div class="list-timestamps"><div>更新 <span class="list-updated-at" th:text="${order.updatedAt == null ? '-' : #temporals.format(order.updatedAt, 'yyyy/MM/dd HH:mm')}">-</span></div><div th:if="${category == 'completed'}">完成 <span class="list-event-at" th:text="${order.completedAt == null ? '-' : #temporals.format(order.completedAt, 'yyyy/MM/dd HH:mm')}">-</span></div></div>

                    </td>

                    <td class="production-order-product-cell">

                        <div class="product-primary"
                             th:text="${order.product.productName}">
                        </div>

                        <div class="product-secondary"
                             th:text="${order.product.modelNo
                                 + ' / '
                                 + order.product.color}">
                        </div>

                    </td>

                    <td th:text=
                        "${order.product.fingerboardMaterial}">
                    </td>

                    <td th:text=
                        "${order.plannedQuantity + ' 台'}">
                    </td>

                    <td th:text=
                        "${order.startedQuantity + ' 台'}">
                    </td>

                    <td th:text=
                        "${order.completedQuantity + ' 台'}">
                    </td>

                    <td>

                        <span class="status-badge"
                              th:classappend=
                              "${@productionOrderDisplay
                                  .getCssClass(order.status)}"
                              th:text=
                              "${@productionOrderDisplay
                                  .getLabel(order.status)}">
                        </span>

                    </td>

                    <td class="table-action-cell">

                        <a class="btn btn-detail"
                           th:href=
                           "@{/production-orders/{id}/view(
                               id=${order.id})}">

                            詳細

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

            <nav th:if="${totalPages > 1}" class="production-order-pagination"
                 aria-label="生産計画一覧のページ切替">
                <a th:if="${hasPrevious}" id="production-order-previous" class="btn btn-outline" rel="prev"
                   th:href="@{/production-orders/view(category=${category},orderNo=${orderNo},product=${product},status=${selectedStatus},planMonth=${planMonth},dueFrom=${dueFrom},dueTo=${dueTo},page=${currentPage - 1})}">← 前へ</a>
                <button th:unless="${hasPrevious}" id="production-order-previous" class="btn btn-outline"
                        type="button" disabled>← 前へ</button>
                <span id="production-order-page-position" aria-live="polite"
                      th:text="${(currentPage + 1) + ' / ' + totalPages}">1 / 2</span>
                <a th:if="${hasNext}" id="production-order-next" class="btn btn-outline" rel="next"
                   th:href="@{/production-orders/view(category=${category},orderNo=${orderNo},product=${product},status=${selectedStatus},planMonth=${planMonth},dueFrom=${dueFrom},dueTo=${dueTo},page=${currentPage + 1})}">次へ →</a>
                <button th:unless="${hasNext}" id="production-order-next" class="btn btn-outline"
                        type="button" disabled>次へ →</button>
            </nav>
        </div>
    </div>
</main>

</body>

</html>
