<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ネック取付登録</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace=
     "~{fragments/header :: header('ネック取付登録')}">
</div>

<section>

    <h2>
        生産計画
    </h2>

    <p>
        生産指示番号：

        <strong th:text=
                "${productionOrder.orderNo}">
        </strong>
    </p>

    <p>
        モデル番号：

        <span th:text=
              "${productionOrder.product.modelNo}">
        </span>
    </p>

    <p>
        製品名：

        <span th:text=
              "${productionOrder.product.productName}">
        </span>
    </p>

    <p>
        カラー：

        <span th:text=
              "${productionOrder.product.color}">
        </span>
    </p>

    <p>
        生産進捗：

        <span th:text=
              "${productionOrder.startedQuantity
                + ' / '
                + productionOrder.plannedQuantity
                + ' 台着手'}">
        </span>
    </p>

</section>

<hr>

<!-- 候補が不足している場合 -->
<div th:if="${#lists.isEmpty(necks)
             or #lists.isEmpty(bodies)}">

    <p class="error-message"
       th:if="${#lists.isEmpty(necks)}">

        組立可能なネックがありません。

    </p>

    <p class="error-message"
       th:if="${#lists.isEmpty(bodies)}">

        組立可能なボディがありません。

    </p>

    <p>
        ネックとボディの工程を完了し、
        両方を組立可能な状態にしてください。
    </p>

</div>

<form th:if="${not #lists.isEmpty(necks)
              and not #lists.isEmpty(bodies)}"
      th:action="@{/assemblies/create}"
      method="post">

    <input type="hidden"
           name="productionOrderId"
           th:value="${productionOrder.id}">

    <fieldset>

        <legend>
            使用部材
        </legend>

        <div>

            <label for="neckId">
                ネック
            </label>

            <select id="neckId"
                    name="neckId"
                    required>

                <option value="">
                    選択してください
                </option>

                <option
                    th:each="neck : ${necks}"
                    th:value="${neck.id}"
                    th:text="${neck.serialNo
                        + ' / '
                        + neck.modelName}">
                </option>

            </select>

        </div>

        <div>

            <label for="bodyId">
                ボディ
            </label>

            <select id="bodyId"
                    name="bodyId"
                    required>

                <option value="">
                    選択してください
                </option>

                <option
                    th:each="body : ${bodies}"
                    th:value="${body.id}"
                    th:text="${body.serialNo
                        + ' / '
                        + body.modelName
                        + ' / '
                        + body.color}">
                </option>

            </select>

        </div>

    </fieldset>

    <fieldset>

        <legend>
            作業情報
        </legend>

        <div>

            <label for="workerName">
                作業者
            </label>

            <input type="text"
                   id="workerName"
                   name="workerName"
                   required>

        </div>

    </fieldset>

    <button type="submit"
            class="process-button process-start-button">

        ネック取付を登録

    </button>

</form>

<br>

<a th:href=
   "@{/production-orders/{id}/view(
       id=${productionOrder.id})}">

    生産計画詳細へ戻る

</a>

<div th:replace=
     "~{fragments/menu :: menu}">
</div>

</body>
</html>
