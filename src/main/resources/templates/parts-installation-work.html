<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターパーツ取付作業票</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/header :: header('ギターパーツ取付作業票')}"></div><main class="page-container" id="parts-work" th:attr="data-read-only=${workView.readOnly}">
<div class="page-toolbar"><p class="page-toolbar-description">工程履歴単位の作業票です。チェック操作は即時保存されます。</p><div class="page-toolbar-actions"><a class="btn btn-outline" th:href="@{/guitars/{id}/view(id=${workView.guitarId})}">ギター詳細へ戻る</a></div></div>
<div id="work-error" class="error-message" role="alert" hidden></div>
<div th:if="${workView.readOnly}" class="information-message">工程終了済みのため読み取り専用です。</div>
<div th:if="${workView.inconsistent}" class="error-message" role="alert">作業項目が存在しない不整合データです。工程終了可能な状態ではありません。</div>
<section class="detail-section"><div class="detail-section-heading"><div><p class="detail-section-caption">Process Work</p><h2 class="detail-section-title" th:text="${workView.guitarSerialNo}"></h2></div><div class="detail-section-count"><span id="completed-count" th:text="${workView.completedCount}"></span><span>/</span><span id="total-count" th:text="${workView.totalCount}"></span><span>完了</span></div></div>
<div class="detail-grid"><div class="detail-item"><div class="detail-label">工程名</div><div class="detail-value" th:text="${workView.processName}"></div></div><div class="detail-item"><div class="detail-label">開始日時</div><div class="detail-value" th:text="${workView.startTime}"></div></div><div class="detail-item"><div class="detail-label">作業者</div><div class="detail-value" th:text="${workView.workerName}"></div></div></div></section>
<section class="detail-section" th:each="group : ${workView.groups}"><div class="detail-section-heading"><h2 class="detail-section-title" th:text="${group.name}"></h2></div><div th:each="item : ${group.items}" class="detail-item work-item" th:attr="data-item-id=${item.id}"><label><input class="work-checkbox" type="checkbox" th:checked="${item.checked}" th:disabled="${workView.readOnly}"> <strong th:text="${item.label}"></strong></label><div th:if="${not #strings.isEmpty(item.instruction)}" class="form-help" th:text="${item.instruction}"></div><div class="form-help completed-at" th:hidden="${not item.checked}" th:text="${item.checked ? '完了: ' + item.completedAt : ''}"></div></div></section>
<section class="detail-section"><div class="detail-section-heading"><h2 class="detail-section-title">開始時仕様スナップショット</h2></div><div class="detail-grid">
<div class="detail-item" th:each="entry : ${ {'ブリッジ方式':workView.snapshot.bridgeType,'ブリッジモデル':workView.snapshot.bridgeModel,'スタッド穴拡張':workView.snapshot.requiresStudHoleExpansion,'ペグモデル':workView.snapshot.tunerModel,'ペグ取付方式':workView.snapshot.tunerMountingType,'ペグブッシュ':workView.snapshot.tunerBushRequired,'ペグ配列':workView.snapshot.tunerLayout,'PU構成':workView.snapshot.pickupLayout,'セレクターポジション':workView.snapshot.selectorPositions,'コントロール構成':workView.snapshot.controlLayout,'ジャック取付方式':workView.snapshot.jackMountingType,'弦メーカー':workView.snapshot.stringMaker,'弦モデル':workView.snapshot.stringModel,'弦ゲージ':workView.snapshot.stringGauge} }"><div class="detail-label" th:text="${entry.key}"></div><div class="detail-value" th:text="${entry.value}"></div></div></div></section>
<section class="detail-section" th:unless="${workView.readOnly}"><form th:action="@{/processes/end}" method="post"><input type="hidden" name="historyId" th:value="${workView.historyId}"><button class="btn btn-process-end" type="submit">工程終了</button></form></section>
</main><script th:inline="none">
(() => {
    const root = document.getElementById('parts-work');
    if (!root || root.dataset.readOnly === 'true') return;
    const error = document.getElementById('work-error');
    const boxes = root.querySelectorAll('.work-checkbox');
    const endButton = root.querySelector('button[type="submit"]');
    let saving = false;
    boxes.forEach(box => box.addEventListener('change', async () => {
        const before = !box.checked;
        if (saving) { box.checked = before; return; }
        saving = true;
        boxes.forEach(item => item.disabled = true);
        if (endButton) endButton.disabled = true;
        error.hidden = true;
        const row = box.closest('.work-item');
        try {
            const response = await fetch('/api/process-work-items/' + row.dataset.itemId + '/complete', {
                method: box.checked ? 'PUT' : 'DELETE',
                headers: {'Accept': 'application/json'}
            });
            if (!response.ok) {
                let data = {};
                try { data = await response.json(); } catch (ignored) {}
                throw new Error(data.message || '作業項目を保存できませんでした。');
            }
            const data = await response.json();
            box.checked = data.checked;
            document.getElementById('completed-count').textContent = data.completedCount;
            document.getElementById('total-count').textContent = data.totalCount;
            const at = row.querySelector('.completed-at');
            at.hidden = !data.checked;
            at.textContent = data.checked ? '完了: ' + data.completedAt : '';
            if (data.readOnly) location.reload();
        } catch (failure) {
            box.checked = before;
            error.textContent = failure.message;
            error.hidden = false;
        } finally {
            saving = false;
            boxes.forEach(item => item.disabled = false);
            if (endButton) endButton.disabled = false;
        }
    }));
})();
</script></body></html>
