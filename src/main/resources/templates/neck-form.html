<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        ネック登録
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('ネック登録')}">
</div>

<main class="page-container">

    <div class="page-toolbar">
        <p class="page-toolbar-description">
            ネックマスタを選択して、
            新しいネック個体を登録します。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/necks/view}">
                ネック一覧へ戻る
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(neckMasters)}"
         class="empty-state">

        <p>
            登録可能なネックマスタがありません。
        </p>

        <a class="btn btn-primary"
           th:href="@{/neck-masters/new}">
            ネックマスタを登録する
        </a>

    </div>

    <form th:if="${not #lists.isEmpty(neckMasters)}"
          th:action="@{/necks/create}"
          method="post"
          id="neckForm"
          class="form-container">

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Neck Identification
                    </p>

                    <h2 class="form-section-title">
                        個体情報
                    </h2>
                </div>

                <p class="form-section-description">
                    シリアル番号は登録時に自動採番されます。
                </p>
            </div>

            <div class="information-message">
                <p>
                    シリアル番号は登録時に自動採番されます。
                </p>
            </div>

        </section>

        <section class="form-section">

            <div class="form-section-heading">
                <div>
                    <p class="form-section-caption">
                        Neck Specification
                    </p>

                    <h2 class="form-section-title">
                        ネック仕様
                    </h2>
                </div>

                <p class="form-section-description">
                    シリーズ、モデル、指板材の順に
                    対象ネックを選択してください。
                </p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="seriesSelect"
                           class="form-label">
                        シリーズ

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="seriesSelect"
                            class="form-select"
                            required>

                        <option value="">
                            選択してください
                        </option>

                        <option value="Traditional">
                            Traditional
                        </option>

                        <option value="Hybrid II">
                            Hybrid II
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="modelSelect"
                           class="form-label">
                        モデル

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="modelSelect"
                            class="form-select"
                            required
                            disabled>

                        <option value="">
                            先にシリーズを選択してください
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="fingerboardSelect"
                           class="form-label">
                        指板材

                        <span class="form-required">
                            必須
                        </span>
                    </label>

                    <select id="fingerboardSelect"
                            class="form-select"
                            required
                            disabled>

                        <option value="">
                            先にモデルを選択してください
                        </option>

                    </select>
                </div>

            </div>

            <input type="hidden"
                   id="neckMasterId"
                   name="neckMasterId">

        </section>

        <div class="form-actions">

            <a class="btn btn-outline"
               th:href="@{/necks/view}">
                キャンセル
            </a>

            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary"
                    disabled>
                ネックを登録
            </button>

        </div>

    </form>

</main>

<script th:inline="javascript">
    const neckMasters =
        /*[[${neckMasters}]]*/ [];

    const seriesSelect =
        document.getElementById(
            "seriesSelect"
        );

    const modelSelect =
        document.getElementById(
            "modelSelect"
        );

    const fingerboardSelect =
        document.getElementById(
            "fingerboardSelect"
        );

    const neckMasterIdInput =
        document.getElementById(
            "neckMasterId"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );

    function resetModelSelect() {
        modelSelect.innerHTML =
            '<option value="">'
            + '先にシリーズを選択してください'
            + '</option>';

        modelSelect.disabled = true;
    }

    function resetFingerboardSelect() {
        fingerboardSelect.innerHTML =
            '<option value="">'
            + '先にモデルを選択してください'
            + '</option>';

        fingerboardSelect.disabled = true;
    }

    function resetSelectedNeckMaster() {
        neckMasterIdInput.value = "";
        registerButton.disabled = true;
    }

    function getBaseModelName(modelName) {
        return modelName
            .replace(
                " Neck / Maple Fingerboard",
                ""
            )
            .replace(
                " Neck / Rosewood Fingerboard",
                ""
            );
    }

    seriesSelect.addEventListener(
        "change",
        function () {
            resetModelSelect();
            resetFingerboardSelect();
            resetSelectedNeckMaster();

            const selectedSeries =
                seriesSelect.value;

            if (selectedSeries === "") {
                return;
            }

            const matchingMasters =
                neckMasters.filter(
                    neckMaster =>
                        neckMaster.modelName.includes(
                            selectedSeries
                        )
                );

            const modelNames = [
                ...new Set(
                    matchingMasters.map(
                        neckMaster =>
                            getBaseModelName(
                                neckMaster.modelName
                            )
                    )
                )
            ];

            modelSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            modelNames.forEach(
                modelName => {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = modelName;
                    option.textContent = modelName;

                    modelSelect.appendChild(
                        option
                    );
                }
            );

            modelSelect.disabled = false;
        }
    );

    modelSelect.addEventListener(
        "change",
        function () {
            resetFingerboardSelect();
            resetSelectedNeckMaster();

            const selectedModel =
                modelSelect.value;

            if (selectedModel === "") {
                return;
            }

            const matchingMasters =
                neckMasters.filter(
                    neckMaster =>
                        getBaseModelName(
                            neckMaster.modelName
                        ) === selectedModel
                );

            fingerboardSelect.innerHTML =
                '<option value="">'
                + '選択してください'
                + '</option>';

            matchingMasters.forEach(
                neckMaster => {
                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        neckMaster.id;

                    option.textContent =
                        neckMaster.fingerboardMaterial;

                    fingerboardSelect.appendChild(
                        option
                    );
                }
            );

            fingerboardSelect.disabled = false;
        }
    );

    fingerboardSelect.addEventListener(
        "change",
        function () {
            const selectedNeckMasterId =
                fingerboardSelect.value;

            neckMasterIdInput.value =
                selectedNeckMasterId;

            registerButton.disabled =
                selectedNeckMasterId === "";
        }
    );

    document
        .getElementById(
            "neckForm"
        )
        .addEventListener(
            "submit",
            function (event) {
                if (neckMasterIdInput.value === "") {
                    event.preventDefault();

                    alert(
                        "シリーズ、モデル、指板材を"
                        + "選択してください。"
                    );
                }
            }
        );
</script>

</body>
</html>
