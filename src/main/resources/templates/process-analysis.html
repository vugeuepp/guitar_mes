<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>工程時間分析</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace=
     "~{fragments/header :: header('工程時間分析')}">
</div>

<section class="analysis-section">

    <h2>ボディ工程</h2>

    <div th:if="${#lists.isEmpty(bodyAverageTimes)}">
        <p>
            ボディ工程データはありません。
        </p>
    </div>

    <table th:if="${not #lists.isEmpty(bodyAverageTimes)}"
           border="1">

        <tr>
            <th>工程</th>
            <th>平均作業時間</th>
            <th>完了実績</th>
        </tr>

        <tr th:each="average : ${bodyAverageTimes}">

            <td th:text="${average.processName}">
            </td>

            <td>
                <span th:if="${average.completedCount > 0}"
                      th:text="${average.averageMinutes + '分'}">
                </span>

                <span th:if="${average.completedCount == 0}">
                    -
                </span>
            </td>

            <td th:text="${average.completedCount + '件'}">
            </td>

        </tr>

    </table>

</section>

<section class="analysis-section">

    <h2>ネック工程</h2>

    <div th:if="${#lists.isEmpty(neckAverageTimes)}">
        <p>
            ネック工程データはありません。
        </p>
    </div>

    <table th:if="${not #lists.isEmpty(neckAverageTimes)}"
           border="1">

        <tr>
            <th>工程</th>
            <th>平均作業時間</th>
            <th>完了実績</th>
        </tr>

        <tr th:each="average : ${neckAverageTimes}">

            <td th:text="${average.processName}">
            </td>

            <td>
                <span th:if="${average.completedCount > 0}"
                      th:text="${average.averageMinutes + '分'}">
                </span>

                <span th:if="${average.completedCount == 0}">
                    -
                </span>
            </td>

            <td th:text="${average.completedCount + '件'}">
            </td>

        </tr>

    </table>

</section>

<section class="analysis-section">

    <h2>ギター工程</h2>

    <div th:if="${#lists.isEmpty(guitarAverageTimes)}">
        <p>
            ギター工程データはありません。
        </p>
    </div>

    <table th:if="${not #lists.isEmpty(guitarAverageTimes)}"
           border="1">

        <tr>
            <th>工程</th>
            <th>平均作業時間</th>
        </tr>

        <tr th:each="average : ${guitarAverageTimes}">

            <td th:text="${average.processName}">
            </td>

            <td th:text="${average.averageMinutes + '分'}">
            </td>

        </tr>

    </table>

</section>

<br>

<a th:href="@{/}">
    ホームへ戻る
</a>

<div th:replace=
     "~{fragments/menu :: menu}">
</div>

</body>
</html>
