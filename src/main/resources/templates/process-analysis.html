<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        工程時間分析
    </title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div th:replace=
     "~{fragments/header :: header('工程時間分析')}">
</div>

<main class="page-container">

    <div class="page-toolbar">

        <p class="page-toolbar-description">
            ボディ・ネック・ギター工程の平均作業時間と
            完了実績を確認できます。
        </p>

        <div class="page-toolbar-actions">
            <a class="btn btn-outline"
               th:href="@{/}">
                ホームへ戻る
            </a>
        </div>

    </div>

    <!-- ボディ工程 -->

    <section class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Body Process Analysis
                </p>

                <h2 class="detail-section-title">
                    ボディ工程
                </h2>
            </div>

            <div class="detail-section-count">
                <span th:text="${#lists.size(bodyAverageTimes)}">
                </span>
                <span>
                    工程
                </span>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(bodyAverageTimes)}"
             class="empty-state">

            <p>
                ボディ工程データはありません。
            </p>

        </div>

        <div th:if="${not #lists.isEmpty(bodyAverageTimes)}"
             class="table-container">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>
                            工程
                        </th>
                        <th>
                            平均作業時間
                        </th>
                        <th>
                            完了実績
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="average : ${bodyAverageTimes}">

                        <td th:text="${average.processName}">
                        </td>

                        <td>

                            <span th:if="${average.completedCount > 0}"
                                  th:text="${average.averageMinutes + '分'}">
                            </span>

                            <span th:if="${average.completedCount == 0}">
                                -
                            </span>

                        </td>

                        <td th:text="${average.completedCount + '件'}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- ネック工程 -->

    <section class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Neck Process Analysis
                </p>

                <h2 class="detail-section-title">
                    ネック工程
                </h2>
            </div>

            <div class="detail-section-count">
                <span th:text="${#lists.size(neckAverageTimes)}">
                </span>
                <span>
                    工程
                </span>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(neckAverageTimes)}"
             class="empty-state">

            <p>
                ネック工程データはありません。
            </p>

        </div>

        <div th:if="${not #lists.isEmpty(neckAverageTimes)}"
             class="table-container">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>
                            工程
                        </th>
                        <th>
                            平均作業時間
                        </th>
                        <th>
                            完了実績
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="average : ${neckAverageTimes}">

                        <td th:text="${average.processName}">
                        </td>

                        <td>

                            <span th:if="${average.completedCount > 0}"
                                  th:text="${average.averageMinutes + '分'}">
                            </span>

                            <span th:if="${average.completedCount == 0}">
                                -
                            </span>

                        </td>

                        <td th:text="${average.completedCount + '件'}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- ギター工程 -->

    <section class="detail-section">

        <div class="detail-section-heading">

            <div>
                <p class="detail-section-caption">
                    Guitar Process Analysis
                </p>

                <h2 class="detail-section-title">
                    ギター工程
                </h2>
            </div>

            <div class="detail-section-count">
                <span th:text="${#lists.size(guitarAverageTimes)}">
                </span>
                <span>
                    工程
                </span>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(guitarAverageTimes)}"
             class="empty-state">

            <p>
                ギター工程データはありません。
            </p>

        </div>

        <div th:if="${not #lists.isEmpty(guitarAverageTimes)}"
             class="table-container">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>
                            工程
                        </th>
                        <th>
                            平均作業時間
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="average : ${guitarAverageTimes}">

                        <td th:text="${average.processName}">
                        </td>

                        <td th:text="${average.averageMinutes + '分'}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <div class="detail-footer-actions">

        <a class="btn btn-outline"
           th:href="@{/}">
            ホームへ戻る
        </a>

    </div>

</main>

</body>
</html>
